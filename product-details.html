<script>
window.openDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.remove('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.remove('opacity-0');
  document.getElementById('drawer-panel').classList.remove('-translate-x-full');
};
window.closeDrawer = function() {
  document.getElementById('drawer-backdrop').classList.add('opacity-0');
  document.getElementById('drawer-panel').classList.add('-translate-x-full');
  setTimeout(() => {
    const w = document.getElementById('mobile-drawer-wrapper');
    if(w) w.classList.add('pointer-events-none');
  }, 300);
};

// Use event delegation or check if DOM is ready because scripts might run before DOM loads if placed in head, but here it's in body
document.addEventListener("DOMContentLoaded", () => {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
});

window.updateCartBadge = function() {
    try {
        const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
        const count = cart.reduce((sum, item) => sum + (item.qty||item.quantity||1), 0);
        const badges = document.querySelectorAll("#cart-badge-nav");
        badges.forEach(b => {
            if(count > 0) { b.textContent = count; b.classList.remove('hidden'); }
            else b.classList.add('hidden');
        });
    } catch(e){}
};

document.addEventListener("DOMContentLoaded", window.updateCartBadge);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
    window.updateCartBadge();
}
</script>


<main class="flex-grow max-w-[520px] mx-auto w-full px-6 py-8" id="product-container">
    <!-- Dynamic content -->

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const product = products.find(p => p.id === productId);

    if(!product) {
      document.getElementById('product-container').innerHTML = '<div class="text-center py-20 text-brown-light">Product not found.</div>';
    } else {
      let thumbsHtml = product.images.map((img, idx) => `
        <img src="${img}" onclick="setMainImage('${img}', this)" class="thumbnail w-16 h-16 object-cover rounded-xl border-2 border-transparent opacity-70 cursor-pointer hover:opacity-100 transition-all ${idx === 0 ? 'thumb-active' : ''}" />
      `).join('');

      document.getElementById('product-container').innerHTML = `
        <div class="anim-1">
            <div class="aspect-square rounded-3xl overflow-hidden mb-4 border border-[#ecdccc]">
                <img id="main-image" src="${product.images[0]}" class="w-full h-full object-cover transition-opacity duration-300" />
            </div>
            
            ${product.images.length > 1 ? `<div class="flex gap-3 mb-8 overflow-x-auto pb-2">${thumbsHtml}</div>` : '<div class="mb-8"></div>'}
            
            <div class="flex justify-between items-start mb-2">
                <h1 class="font-cormorant text-3xl italic text-[#6b4f35]">${product.name}</h1>
                <span class="text-lg font-medium text-[#9e7550]">${product.price} EGP</span>
            </div>
            
            <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882] mb-6">${product.category}</p>
            
            <div class="bg-[#faf5ef] rounded-2xl p-5 border border-[#ecdccc]/50 mb-8">
                <h3 class="text-[10px] uppercase tracking-widest text-brown-light mb-2">Description</h3>
                <p class="text-[14px] leading-relaxed text-[#6b4f35]">${product.description}</p>
            </div>
            
            <button onclick="addToCart(event, '${product.id}'); " class="w-full bg-[#9e7550] text-white py-4 rounded-xl text-[12px] uppercase tracking-widest hover:bg-[#6b4f35] transition duration-300 font-medium">Add to Cart & Customize</button>
        </div>
      `;
    }

    function setMainImage(src, el) {
        document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('thumb-active'));
        el.classList.add('thumb-active');
        const mainImg = document.getElementById('main-image');
        mainImg.style.opacity = 0;
        setTimeout(() => {
            mainImg.src = src;
            mainImg.style.opacity = 1;
        }, 150);
    }
  </script>
