<script>
window.openDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.remove('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.remove('opacity-0');
  document.getElementById('drawer-panel').classList.remove('-translate-x-full');
};
window.closeDrawer = function() {
  document.getElementById('drawer-backdrop').classList.add('opacity-0');
  document.getElementById('drawer-panel').classList.add('-translate-x-full');
  setTimeout(() => {
    const w = document.getElementById('mobile-drawer-wrapper');
    if(w) w.classList.add('pointer-events-none');
  }, 300);
};

// Use event delegation or check if DOM is ready because scripts might run before DOM loads if placed in head, but here it's in body
document.addEventListener("DOMContentLoaded", () => {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
});

window.updateCartBadge = function() {
    try {
        const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
        const count = cart.reduce((sum, item) => sum + (item.qty||item.quantity||1), 0);
        const badges = document.querySelectorAll("#cart-badge-nav");
        badges.forEach(b => {
            if(count > 0) { b.textContent = count; b.classList.remove('hidden'); }
            else b.classList.add('hidden');
        });
    } catch(e){}
};

document.addEventListener("DOMContentLoaded", window.updateCartBadge);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
    window.updateCartBadge();
}
</script>

    function initFrameCustomization() {
        const availablePatterns = [
            { id: "pat1", name: "Classic Wood", img: "images/pattern1.jpg" },
            { id: "pat2", name: "Dark Walnut", img: "images/pattern2.jpg" },
            { id: "pat3", name: "White Oak", img: "images/pattern3.jpg" }
        ];
        const availableShapes = [
            { id: "shp1", img: "images/shape-circle.png" },
            { id: "shp2", img: "images/shape-square.png" },
            { id: "shp3", img: "images/shape-hex.png" },
            { id: "shp4", img: "images/shape-arch.png" },
            { id: "shp5", img: "images/shape-star.png" },
            { id: "shp6", img: "images/shape-heart.png" }
        ];

        const pGrid = document.getElementById('pattern-grid');
        availablePatterns.forEach(pat => {
            const el = document.createElement('div');
            el.className = 'custom-option pattern-card bg-[#faf5ef]';
            el.innerHTML = '<img src="' + pat.img + '" alt="' + pat.name + '" onerror="this.src=\'https://via.placeholder.com/150x80\'" />';
            el.addEventListener('click', () => {
                customization.pattern = pat.id;
                pGrid.querySelectorAll('.pattern-card').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');
                document.getElementById('pattern-status').innerText = pat.name;
                document.getElementById('pattern-status').className = 'text-[11px] text-[#6b4f35] font-bold';
                validateForm();
            });
            pGrid.appendChild(el);
        });

        const sGrid = document.getElementById('shape-grid');
        availableShapes.forEach(shp => {
            const el = document.createElement('div');
            el.className = 'custom-option shape-card bg-[#faf5ef] flex-shrink-0';
            el.innerHTML = '<img src="' + shp.img + '" onerror="this.src=\'https://via.placeholder.com/60\'"/>';

                const idx = customization.shapes.indexOf(shp.id);
                if (idx > -1) {
                    customization.shapes.splice(idx, 1);
                    el.classList.remove('selected');
                } else {
                    if (customization.shapes.length >= 6) {
                        alert('You can only select up to 6 shapes.');
                        return;
                    }
                    customization.shapes.push(shp.id);
                    el.classList.add('selected');
                }
                const cnt = document.getElementById('shape-counter');
                cnt.innerText = customization.shapes.length + ' / 6 selected';
                if(customization.shapes.length > 0) cnt.className = 'text-[10px] text-[#6b4f35] font-bold';
                else cnt.className = 'text-[10px] text-[#c4a882] tracking-wider font-medium';
                validateForm();
            });
            sGrid.appendChild(el);
        });
    }

    function setMainImage(src, el) {
        document.querySelectorAll('.thumbnail').forEach(t => {
           t.classList.remove('border-[#9e7550]'); 
           t.classList.remove('opacity-100'); 
           t.classList.add('border-transparent');
           t.classList.add('opacity-70');
        });
        el.classList.remove('border-transparent');
        el.classList.remove('opacity-70');
        el.classList.add('border-[#9e7550]');
        el.classList.add('opacity-100');
        const mainImg = document.getElementById('main-image');
        mainImg.style.opacity = 0;
        setTimeout(() => {
            mainImg.src = src;
            mainImg.style.opacity = 1;
        }, 150);
    }

    function handleImageUpload(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        if (product.id.startsWith('frame')) {
            if (uploadedBase64Images.length + files.length > 6) {
                alert('You can only upload up to 6 images.');
                e.target.value = '';
                return;
            }
        }
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                uploadedBase64Images.push(ev.target.result);
                renderPreviews();
                validateForm();
            };
            reader.readAsDataURL(file);
        });
        e.target.value = ''; // reset so same files can be chosen again if needed
    }

    function removePreview(idx) {
        uploadedBase64Images.splice(idx, 1);
        renderPreviews();
        validateForm();
    }

    function renderPreviews() {
        const container = document.getElementById('img-preview-container');
        container.innerHTML = '';
        uploadedBase64Images.forEach((src, idx) => {
            const div = document.createElement('div');
            div.className = 'relative w-16 h-16 rounded-xl border border-[#ecdccc] overflow-hidden anim-1';
            div.innerHTML = `
                <img src="${src}" class="w-full h-full object-cover" />
                <button onclick="removePreview(${idx})" class="absolute top-1 right-1 bg-white/80 rounded-full p-1 text-[#6b4f35] hover:text-red-500 transition shadow-sm">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `;
            container.appendChild(div);
        });
    }

    function validateForm() {
        const loveInput = document.getElementById('love-msg');
        const storyInput = document.getElementById('story-msg');
        const proudInput = document.getElementById('proud-msg');
        const songInput = document.getElementById('song-msg');
        
        const btn = document.getElementById('add-to-cart-btn');
        const uploadBox = document.getElementById('upload-box');
        
        let isValid = loveInput.value.trim() && storyInput.value.trim() && proudInput.value.trim() && songInput.value.trim() && uploadedBase64Images.length > 0;
        
        if (product.id.startsWith('frame')) {
            isValid = isValid && customization.pattern !== null && customization.shapes.length > 0;
        }
        
        if (!isValid) {
            btn.disabled = true;
            btn.classList.add('cursor-not-allowed', 'bg-[#ecdccc]', 'text-[#9e7550]');
            btn.classList.remove('bg-[#9e7550]', 'text-white', 'hover:bg-[#6b4f35]');
        } else {
            btn.disabled = false;
            btn.classList.remove('cursor-not-allowed', 'bg-[#ecdccc]', 'text-[#9e7550]');
            btn.classList.add('bg-[#9e7550]', 'text-white', 'hover:bg-[#6b4f35]');
            
            [loveInput, storyInput, proudInput, songInput, uploadBox].forEach(el => el.classList.remove('border-red-400'));
        }
    }

    function addToCartDetail(e) {
        e.preventDefault();
        
        const loveInput = document.getElementById('love-msg');
        const storyInput = document.getElementById('story-msg');
        const proudInput = document.getElementById('proud-msg');
        const songInput = document.getElementById('song-msg');
        const uploadBox = document.getElementById('upload-box');
        
        const love = loveInput.value.trim();
        const story = storyInput.value.trim();
        const proud = proudInput.value.trim();
        const song = songInput.value.trim();
        
        if (!love || !story || !proud || !song || uploadedBase64Images.length === 0) {
            if(!love) loveInput.classList.add('border-red-400');
            if(!story) storyInput.classList.add('border-red-400');
            if(!proud) proudInput.classList.add('border-red-400');
            if(!song) songInput.classList.add('border-red-400');
            if(uploadedBase64Images.length === 0) uploadBox.classList.add('border-red-400');
            return;
        }
        
        let cart = JSON.parse(localStorage.getItem('hc_cart') || '[]');
        
        const cartItem = {
             id: product.id + '-' + Date.now(), 
             baseId: product.id,
             name: product.name, 
             price: product.price, 
             qty: 1, 
             quantity: 1, 
             img: product.images[0],
             messages: {
                 love,
                 story,
                 proud,
                 song
             },
             customization: product.id.startsWith('frame') ? { ...customization } : undefined,
             images: [...uploadedBase64Images]
        };
        
        cart.push(cartItem);
        localStorage.setItem('hc_cart', JSON.stringify(cart));
        
        if(typeof updateCartBadge !== 'undefined') updateCartBadge();
        const btn = document.getElementById('add-to-cart-btn');
        btn.innerText = 'Added ✔'; 
        btn.style.backgroundColor = '#7a5c3e'; 
        
        setTimeout(() => {
           window.location.href = 'cart.html';
        }, 800);
    }
  </script>

</body>
</html>
