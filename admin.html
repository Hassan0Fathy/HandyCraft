<script>
window.openDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.remove('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.remove('opacity-0');
  document.getElementById('drawer-panel').classList.remove('-translate-x-full');
};
window.closeDrawer = function() {
  document.getElementById('drawer-backdrop').classList.add('opacity-0');
  document.getElementById('drawer-panel').classList.add('-translate-x-full');
  setTimeout(() => {
    const w = document.getElementById('mobile-drawer-wrapper');
    if(w) w.classList.add('pointer-events-none');
  }, 300);
};

// Use event delegation or check if DOM is ready because scripts might run before DOM loads if placed in head, but here it's in body
document.addEventListener("DOMContentLoaded", () => {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
});

window.updateCartBadge = function() {
    try {
        const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
        const count = cart.reduce((sum, item) => sum + (item.qty||item.quantity||1), 0);
        const badges = document.querySelectorAll("#cart-badge-nav");
        badges.forEach(b => {
            if(count > 0) { b.textContent = count; b.classList.remove('hidden'); }
            else b.classList.add('hidden');
        });
    } catch(e){}
};

document.addEventListener("DOMContentLoaded", window.updateCartBadge);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    const menuBtn = document.getElementById('menu-open-btn');
    if(menuBtn) menuBtn.addEventListener('click', window.openDrawer);
    window.updateCartBadge();
}
</script>

        </div>
      `;
      grid.insertAdjacentHTML('beforeend', card);
    });
  }

  function filterOrders(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-tab').forEach(b => {
      if(b.innerText === status) b.classList.add('active', 'text-white', 'bg-brown-dark', 'hover:bg-brown-dark');
      else b.classList.remove('active', 'text-white', 'bg-brown-dark', 'hover:bg-brown-dark');
    });
    renderOrders();
  }

  function updateStatus(idx, newStatus) {
    orders[idx].status = newStatus;
    localStorage.setItem('hc_orders', JSON.stringify(orders));
    renderOrders();
  }

  function viewDetails(idx) {
    const o = orders[idx];

    let msgsHtml = '';
    let hasImages = false;
    let imagesGalleryHtml = '';

    if (o.itemDetails && o.itemDetails.length > 0) {
      o.itemDetails.forEach((item, i) => {
        let msgBlocks = item.messages.map(m => `<div class="mb-2"><span class="text-[10px] uppercase text-brown-light block font-semibold tracking-wide">${m.type}</span><p class="text-[13px] text-brown-dark bg-[#faf5ef] p-2 rounded border border-brown-pale/40">${m.text}</p></div>`).join('');
        if(item.images && item.images.length > 0) {
          hasImages = true;
          let imgsHtml = item.images.map(img => `<img src="${img}" class="w-16 h-16 rounded-lg object-cover border border-[#e8d8c8] cursor-pointer hover:border-[#9e7550] transition" onclick="window.open('${img}', '_blank')">`).join('');
          imagesGalleryHtml += `<div class="mb-3"><span class="text-[10px] uppercase text-brown-light block font-semibold mb-2">Item ${i+1} Images</span><div class="flex flex-wrap gap-2">${imgsHtml}</div></div>`;
        }
        
        msgsHtml += `
          <div class="bg-white p-4 rounded-xl border border-brown-pale/40 shadow-sm mb-4">
            <h4 class="font-cormorant text-lg italic text-[#6b4f35] mb-3 border-b border-[#e8d8c8]/50 pb-2">Item ${i+1} Details</h4>
            ${msgBlocks || '<span class="text-xs text-brown-light italic">No text messages provided.</span>'}
          </div>
        `;
      });
    } else {
      msgsHtml = '<span class="text-sm text-brown-light italic">No custom details provided.</span>';
    }

    let receiptHtml = '';
    if(o.receiptImg) {
      receiptHtml = `<div class="mt-4"><span class="text-[10px] uppercase text-brown-light block font-semibold mb-2">Payment Receipt</span><img src="${o.receiptImg}" class="w-full max-h-48 object-cover rounded-xl border border-brown-pale shadow-sm cursor-pointer" onclick="window.open('${o.receiptImg}', '_blank')" onerror="this.style.display='none'"></div>`;
    }

    const downloadBtn = hasImages ? `<button onclick="alert('In a real app, this would zip and download all item images.')" class="mt-2 w-full border border-[#c4a882] text-[#9e7550] text-[10px] tracking-[0.1em] uppercase py-2 rounded-lg hover:bg-[#faf5ef] transition font-medium">Download All Images</button>` : '';

    const body = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Left Column: Customer & Payment -->
        <div class="flex flex-col gap-4">
          <div class="bg-beige-soft rounded-xl p-5 border border-[#e8d8c8]/40 shadow-sm">
            <div class="flex items-center gap-2 mb-3 border-b border-[#e8d8c8] pb-2">
               <svg class="w-4 h-4 text-brown-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
               <h3 class="font-cormorant text-xl italic text-brown-mid">Customer Info</h3>
            </div>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Name</span><span class="font-medium text-brown-dark">${o.customer}</span></div>
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Phone</span><span class="font-medium text-brown-dark">${o.phone}</span></div>
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Instagram</span><a href="https://instagram.com/${o.ig.replace('@','')}" target="_blank" class="text-blue-500 hover:underline">${o.ig}</a></div>
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Delivery Addr.</span><span class="text-brown-dark">${o.address || 'N/A'}</span></div>
            </div>
          </div>
          
          <div class="bg-beige-soft rounded-xl p-5 border border-[#e8d8c8]/40 shadow-sm">
            <div class="flex items-center gap-2 mb-3 border-b border-[#e8d8c8] pb-2">
               <svg class="w-4 h-4 text-brown-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
               <h3 class="font-cormorant text-xl italic text-brown-mid">Payment Info</h3>
            </div>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Total</span><span class="font-medium text-brown-dark">EGP ${o.total}</span></div>
              <div><span class="text-[10px] uppercase tracking-widest text-brown-light block">Method</span><span class="text-brown-dark">${o.paymentMethod || 'Vodafone Cash'}</span></div>
              <div class="col-span-2"><span class="text-[10px] uppercase tracking-widest text-brown-light block">TX ID</span><span class="font-medium tracking-wider text-brown-dark">${o.txid}</span></div>
            </div>
            ${receiptHtml}
          </div>
        </div>
        
        <!-- Right Column: Customization -->
        <div class="flex flex-col gap-4">
          <div class="bg-beige-soft rounded-xl p-5 border border-[#e8d8c8]/40 shadow-sm h-full">
            <div class="flex items-center gap-2 mb-3 border-b border-[#e8d8c8] pb-2">
               <svg class="w-4 h-4 text-brown-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
               <h3 class="font-cormorant text-xl italic text-brown-mid">Customization</h3>
            </div>
            <div class="max-h-[300px] overflow-y-auto pr-1">
              ${msgsHtml}
              ${imagesGalleryHtml}
              ${downloadBtn}
            </div>
          </div>
        </div>
      </div>
      
      <div class="mt-6 pt-4 border-t border-[#e8d8c8] flex gap-3 justify-end bg-[#faf5ef] -mx-6 px-6 pb-2">
        <button onclick="updateDetailsStatus(${idx}, 'Rejected')" class="px-6 py-2.5 bg-white border border-red-200 text-red-600 rounded-lg text-[11px] font-semibold uppercase tracking-wider hover:bg-red-50 transition">Reject</button>
        <button onclick="updateDetailsStatus(${idx}, 'Paid')" class="px-6 py-2.5 bg-blue-50 border border-blue-200 text-blue-600 rounded-lg text-[11px] font-semibold uppercase tracking-wider hover:bg-blue-100 transition">Mark Paid</button>
        <button onclick="updateDetailsStatus(${idx}, 'Completed')" class="px-6 py-2.5 bg-[#9e7550] border border-[#9e7550] text-white rounded-lg text-[11px] font-semibold uppercase tracking-wider hover:bg-[#7a5c3e] transition">Complete</button>
      </div>
    `;

    document.getElementById('modal-body').innerHTML = body;
    const modal = document.getElementById('order-modal');
    modal.classList.remove('pointer-events-none', 'opacity-0');
    document.getElementById('modal-content').classList.remove('translate-y-full', 'sm:translate-y-8');
  }

  function updateDetailsStatus(idx, newStatus) {
    updateStatus(idx, newStatus);
    closeModal();
  }

  function closeModal() {
    document.getElementById('modal-content').classList.add('translate-y-full', 'sm:translate-y-8');
    document.getElementById('order-modal').classList.add('opacity-0');
    setTimeout(() => document.getElementById('order-modal').classList.add('pointer-events-none'), 300);
  }

  renderOrders();
</script>
</body>
</html>
