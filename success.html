<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Order received – Handy Crafts will be in touch soon." />
  <title>Order Received | Handy Crafts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brown:{dark:'#6b4f35',mid:'#9e7550',light:'#c4a882',pale:'#ecdccc'},beige:{soft:'#faf5ef',cream:'#fffdf9'}}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'Jost',sans-serif;background-color:#fffdf9;color:#6b4f35}
    .font-cormorant{font-family:'Cormorant Garamond',serif}
    @keyframes scaleIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; }}
    .animate-scale-in { animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; }}
    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
  <script src="script.js"></script>
</head>
<body class="bg-[#fffdf9] min-h-screen flex flex-col items-center justify-center p-5 relative overflow-hidden">

  <!-- Subtle background decoration -->
  <div class="absolute -top-[20%] -left-[10%] w-[50%] pt-[50%] bg-[#faf5ef] rounded-full blur-[100px] z-0 opacity-60"></div>
  <div class="absolute -bottom-[20%] -right-[10%] w-[50%] pt-[50%] bg-[#ecdccc] rounded-full blur-[120px] z-0 opacity-30"></div>

  <div class="z-10 bg-white/80 backdrop-blur-xl rounded-[2rem] p-10 max-w-[480px] w-full shadow-[0_8px_30px_rgba(158,117,80,0.06)] border border-[#e8d8c8]/40 flex flex-col items-center text-center animate-scale-in">
    
    <div class="w-20 h-20 rounded-full bg-[#faf5ef] flex items-center justify-center mb-6 shadow-inner border border-[#e8d8c8]/50 animate-slide-up" style="animation-delay: 0.1s; opacity: 0;">
      <svg class="w-10 h-10 text-[#9e7550]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m4.5 12.75 6 6 9-13.5" /></svg>
    </div>

    <h1 class="font-cormorant text-4xl italic text-[#6b4f35] mb-2 animate-slide-up" style="animation-delay: 0.2s; opacity: 0;">Order Received</h1>
    <p class="text-[#9e7550] text-[15px] font-medium tracking-wide mb-6 animate-slide-up" style="animation-delay: 0.3s; opacity: 0;">We’ll contact you soon to coordinate your personalized items.</p>
    
    <div class="bg-[#faf5ef] rounded-xl px-8 py-5 w-full border border-[#e8d8c8]/60 mb-8 animate-slide-up" style="animation-delay: 0.4s; opacity: 0;">
      <span class="block text-[10px] uppercase tracking-[0.25em] text-[#c4a882] mb-1.5 font-medium">Your Order ID</span>
      <span id="succ-order-id" class="font-cormorant text-2xl font-medium text-[#6b4f35] italic tracking-wider">#---------</span>
    </div>

    <div class="bg-white rounded-xl px-6 py-4 w-full border border-[#c4a882]/40 mb-6 animate-slide-up flex flex-col gap-2" style="animation-delay: 0.45s; opacity: 0;">
      <div class="flex items-center justify-between">
        <span class="text-[10px] uppercase tracking-[0.25em] text-[#9e7550] font-medium">Transaction ID</span>
        <button onclick="copyToClipboard(document.getElementById('succ-transaction-id').innerText)" class="text-[10px] uppercase tracking-[0.15em] text-[#c4a882] hover:text-[#9e7550] transition font-medium px-2 py-1 hover:bg-[#faf5ef] rounded">Copy</button>
      </div>
      <span id="succ-transaction-id" class="font-mono text-sm font-semibold text-[#6b4f35] tracking-wider break-all">TXN-PENDING</span>
      <span class="text-[11px] text-[#9e7550] mt-1">Use this ID to track your order status</span>
    </div>

    <div class="flex flex-col gap-4 w-full animate-slide-up" style="animation-delay: 0.5s; opacity: 0;">
      <a href="index.html" class="w-full bg-[#9e7550] text-white text-[12px] tracking-[0.22em] uppercase py-4.5 rounded-xl hover:bg-[#7a5c3e] transition shadow-md hover:shadow-lg font-medium" style="padding-top:1.1rem; padding-bottom:1.1rem; display:block;">Back to Home</a>
      <a href="https://www.instagram.com/handy_crafts1_/" target="_blank" class="w-full border-2 border-[#e8d8c8] text-[#9e7550] text-[12px] tracking-[0.22em] uppercase py-4 rounded-xl hover:bg-[#faf5ef] hover:border-[#c4a882] transition font-medium" style="display:block;">Visit our Instagram</a>
    </div>

  </div>

  <script>
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = originalText; }, 2000);
      });
    }

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const transactionId = params.get('transactionId') || sessionStorage.getItem('hc_last_transaction_id');
    
    // Display Order ID
    if (orderId) {
      document.getElementById('succ-order-id').innerText = orderId;
    } else {
      document.getElementById('succ-order-id').innerText = '#' + Math.floor(1000 + Math.random() * 9000);
    }
    
    // Display Transaction ID
    if (transactionId) {
      document.getElementById('succ-transaction-id').innerText = transactionId;
    } else {
      // Fallback: generate one if not available
      const randomTxn = 'TXN-' + new Date().toISOString().replace(/[^0-9]/g, '').slice(2, 14) + '-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0');
      document.getElementById('succ-transaction-id').innerText = randomTxn;
    }
  </script>
</body>
</html>
