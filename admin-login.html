<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandyCraft Admin Login</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <style>
        :root {
            --brown-dark: #6b4f35;
            --brown-mid: #9e7550;
            --brown-light: #c4a882;
            --beige-light: #f5ede3;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#fffdf9] to-[#f5ede3]">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-serif text-[#6b4f35] mb-2">HandyCraft</h1>
                <p class="text-gray-600">Admin Dashboard</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-3xl shadow-lg p-8">
                <h2 class="text-2xl font-serif text-[#6b4f35] mb-6 text-center">Admin Login</h2>

                <!-- Error Message -->
                <div id="error-message" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

                <!-- Success Message -->
                <div id="success-message" class="hidden mb-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-600 text-sm"></div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-[#6b4f35] mb-2">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Enter admin password"
                            class="w-full px-4 py-3 border border-[#ecdccc] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#9e7550] focus:border-transparent"
                            required
                        >
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-[#9e7550] text-white font-medium py-3 rounded-lg hover:bg-[#7a5c3e] transition-colors duration-200 mt-6"
                    >
                        Login
                    </button>
                </form>

                <p class="text-center text-xs text-gray-500 mt-6">
                    Use the password set in your backend `.env` as `ADMIN_PASSWORD`.
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            const password = document.getElementById('password').value;

            if (!password) {
                showError('Password is required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();
                if (!response.ok) {
                    showError(data.message || 'Login failed');
                    return;
                }

                if (data?.token) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminAuthenticated', 'true');
                }

                showSuccess('Login successful! Redirecting...');
                setTimeout(() => { window.location.href = 'admin.html'; }, 800);
            } catch (err) {
                showError(err.message || 'Login request failed');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
