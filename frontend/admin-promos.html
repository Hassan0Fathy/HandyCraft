<script>
// Drawer management
window.openDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.remove('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.remove('opacity-0');
  document.getElementById('drawer-panel').classList.remove('-translate-x-full');
};

window.closeDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.add('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.add('opacity-0');
  document.getElementById('drawer-panel').classList.add('-translate-x-full');
};

// Navbar event listeners
function initializeNavbarListeners() {
  const menuBtn = document.getElementById('menu-open-btn');
  if(menuBtn && !menuBtn.dataset.eventBound) {
    menuBtn.addEventListener('click', (e) => {
      e.preventDefault();
      window.openDrawer();
    });
    menuBtn.dataset.eventBound = 'true';
  }
  
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn && !logoutBtn.dataset.eventBound) {
    logoutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminAuthenticated');
      window.location.href = 'admin-login.html';
    });
    logoutBtn.dataset.eventBound = 'true';
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initializeNavbarListeners();
});
</script>

<script>
  const API_BASE_URL = (window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api").replace(/\/$/, '');

  function checkAuth() {
    const isAuthenticated = localStorage.getItem('adminAuthenticated') === 'true';
    if (!isAuthenticated) {
      window.location.href = 'admin-login.html';
      return false;
    }
    return localStorage.getItem('adminToken') || '';
  }

  function getAuthHeaders(token) {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };
  }

  function handleAuthError(response) {
    if (response.status === 401 || response.status === 403) {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminAuthenticated');
      window.location.href = 'admin-login.html';
      return true;
    }
    return false;
  }

  const adminToken = checkAuth();
  let promos = [];

  async function fetchPromos() {
    try {
      const res = await fetch(`${API_BASE_URL}/promos`, {
        headers: getAuthHeaders(adminToken)
      });
      if (handleAuthError(res)) return;
      promos = await res.json();
      renderPromosTable();
    } catch (error) {
      console.error('Error fetching promos:', error);
      alert('Failed to load promo codes.');
    }
  }

  function renderPromosTable() {
    const tbody = document.getElementById('promos-table-body');
    if (promos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="p-10 text-center text-[#9e7550]">No promo codes created yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = promos.map(p => {
      const expiry = p.expirationDate ? new Date(p.expirationDate).toLocaleDateString() : 'Never';
      const limit = p.usageLimit !== null ? `${p.usedCount} / ${p.usageLimit}` : `${p.usedCount} / ∞`;
      return `
        <tr class="hover:bg-[#faf5ef]/50 transition-colors">
          <td class="p-5 font-bold tracking-wide text-[#6b4f35]">${p.code}</td>
          <td class="p-5 text-xs uppercase tracking-wider text-[#9e7550]">${p.discountType}</td>
          <td class="p-5 font-medium">${p.discountType === 'percentage' ? `${p.discountValue}%` : `EGP ${p.discountValue}`}</td>
          <td class="p-5">EGP ${p.minOrderAmount}</td>
          <td class="p-5 text-xs text-[#9e7550]">${expiry}</td>
          <td class="p-5 text-xs">${limit}</td>
          <td class="p-5 text-center">
            <button onclick="togglePromoActive('${p._id}', ${p.isActive})" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${p.isActive ? 'badge-active' : 'badge-inactive'}">
              ${p.isActive ? 'Active' : 'Disabled'}
            </button>
          </td>
          <td class="p-5 text-right space-x-2">
            <button onclick="openEditPromoModal('${p._id}')" class="text-brown-mid hover:text-brown-dark font-medium text-xs uppercase tracking-wider">Edit</button>
            <button onclick="deletePromo('${p._id}')" class="text-red-400 hover:text-red-600 font-medium text-xs uppercase tracking-wider">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Active / Disable Toggle
  async function togglePromoActive(id, currentStatus) {
    try {
      const res = await fetch(`${API_BASE_URL}/promos/${id}`, {
        method: 'PUT',
        headers: getAuthHeaders(adminToken),
        body: JSON.stringify({ isActive: !currentStatus })
      });
      if (handleAuthError(res)) return;
      if (res.ok) {
        fetchPromos();
      }
    } catch (error) {
      console.error('Error toggling promo:', error);
    }
  }

  // Delete Promo Code
  async function deletePromo(id) {
    if (!confirm('Are you sure you want to delete this promo code?')) return;
    try {
      const res = await fetch(`${API_BASE_URL}/promos/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders(adminToken)
      });
      if (handleAuthError(res)) return;
      if (res.ok) {
        fetchPromos();
      }
    } catch (error) {
      console.error('Error deleting promo:', error);
    }
  }

  // Modals management
  function openAddPromoModal() {
    const modal = document.getElementById('add-promo-modal');
    const content = document.getElementById('add-promo-modal-content');
    modal.classList.remove('pointer-events-none', 'opacity-0');
    content.classList.remove('scale-95');
  }

  function closeAddPromoModal() {
    const modal = document.getElementById('add-promo-modal');
    const content = document.getElementById('add-promo-modal-content');
    modal.classList.add('pointer-events-none', 'opacity-0');
    content.classList.add('scale-95');
    document.getElementById('add-promo-form').reset();
  }

  function openEditPromoModal(id) {
    const p = promos.find(item => item._id === id);
    if (!p) return;

    document.getElementById('edit-promo-id').value = p._id;
    document.getElementById('edit-promo-code').value = p.code;
    document.getElementById('edit-promo-type').value = p.discountType;
    document.getElementById('edit-promo-value').value = p.discountValue;
    document.getElementById('edit-promo-min').value = p.minOrderAmount;
    document.getElementById('edit-promo-expiry').value = p.expirationDate ? p.expirationDate.split('T')[0] : '';
    document.getElementById('edit-promo-limit').value = p.usageLimit || '';
    document.getElementById('edit-promo-active').checked = p.isActive;

    const modal = document.getElementById('edit-promo-modal');
    const content = document.getElementById('edit-promo-modal-content');
    modal.classList.remove('pointer-events-none', 'opacity-0');
    content.classList.remove('scale-95');
  }

  function closeEditPromoModal() {
    const modal = document.getElementById('edit-promo-modal');
    const content = document.getElementById('edit-promo-modal-content');
    modal.classList.add('pointer-events-none', 'opacity-0');
    content.classList.add('scale-95');
    document.getElementById('edit-promo-form').reset();
  }

  // Forms Submission
  document.getElementById('add-promo-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('promo-code').value;
    const discountType = document.getElementById('promo-type').value;
    const discountValue = parseFloat(document.getElementById('promo-value').value);
    const minOrderAmount = parseFloat(document.getElementById('promo-min').value) || 0;
    const expirationDate = document.getElementById('promo-expiry').value || null;
    const usageLimit = parseInt(document.getElementById('promo-limit').value) || null;
    const isActive = document.getElementById('promo-active').checked;

    try {
      const res = await fetch(`${API_BASE_URL}/promos`, {
        method: 'POST',
        headers: getAuthHeaders(adminToken),
        body: JSON.stringify({ code, discountType, discountValue, minOrderAmount, expirationDate, usageLimit, isActive })
      });
      if (handleAuthError(res)) return;
      if (res.ok) {
        closeAddPromoModal();
        fetchPromos();
      } else {
        const err = await res.json();
        alert(err.message || 'Failed to add promo code.');
      }
    } catch (error) {
      console.error('Error creating promo:', error);
    }
  });

  document.getElementById('edit-promo-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('edit-promo-id').value;
    const code = document.getElementById('edit-promo-code').value;
    const discountType = document.getElementById('edit-promo-type').value;
    const discountValue = parseFloat(document.getElementById('edit-promo-value').value);
    const minOrderAmount = parseFloat(document.getElementById('edit-promo-min').value) || 0;
    const expirationDate = document.getElementById('edit-promo-expiry').value || null;
    const usageLimit = parseInt(document.getElementById('edit-promo-limit').value) || null;
    const isActive = document.getElementById('edit-promo-active').checked;

    try {
      const res = await fetch(`${API_BASE_URL}/promos/${id}`, {
        method: 'PUT',
        headers: getAuthHeaders(adminToken),
        body: JSON.stringify({ code, discountType, discountValue, minOrderAmount, expirationDate, usageLimit, isActive })
      });
      if (handleAuthError(res)) return;
      if (res.ok) {
        closeEditPromoModal();
        fetchPromos();
      } else {
        const err = await res.json();
        alert(err.message || 'Failed to update promo code.');
      }
    } catch (error) {
      console.error('Error updating promo:', error);
    }
  });

  if (adminToken) {
    fetchPromos();
  }
</script>
</body>
</html>
