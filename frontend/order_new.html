<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Handy Crafts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brown:{dark:"#6b4f35",mid:"#9e7550",light:"#c4a882",pale:"#ecdccc"},beige:{soft:"#faf5ef",cream:"#fffdf9"}}}}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>body{font-family:"Jost",sans-serif;background-color:"#fffdf9";color:"#6b4f35"}.font-cormorant{font-family:"Cormorant Garamond",serif}</style>
</head>
<body class="bg-[#fffdf9] min-h-screen pb-20">
<nav></nav>

<main class="max-w-[520px] mx-auto px-5 pt-8">
  
  <div class="mb-8">
    <div class="flex items-center justify-between text-xs text-[#c4a882] tracking-[0.2em] mb-3">
      <span class="text-[#9e7550] font-medium">1. DETAILS</span>
      <span class="px-2">→</span>
      <span>2. PAYMENT</span>
    </div>
    <h1 class="font-cormorant text-4xl italic text-[#6b4f35]">Order Details</h1>
    <p class="text-[#9e7550] mt-2 text-sm leading-relaxed">Tell us who you are and customize your items.</p>
  </div>

  <form id="orderForm" action="payment.html" method="GET" class="flex flex-col gap-6">
    <div class="bg-white rounded-2xl p-5 shadow-[0_4px_20px_rgba(158,117,80,0.05)] border border-[#e8d8c8]/50">
      <h2 class="font-cormorant text-2xl italic text-[#6b4f35] mb-4">Contact Info</h2>
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs uppercase tracking-widest text-[#9e7550] mb-2 font-medium">Full Name</label>
          <input type="text" required class="w-full bg-[#faf5ef] rounded-xl px-4 py-3 text-sm text-[#6b4f35] border-none outline-none focus:ring-1 focus:ring-[#c4a882] transition" placeholder="Your name" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-[#9e7550] mb-2 font-medium">Phone Number</label>
          <input type="tel" required class="w-full bg-[#faf5ef] rounded-xl px-4 py-3 text-sm text-[#6b4f35] border-none outline-none focus:ring-1 focus:ring-[#c4a882] transition" placeholder="010..." />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-[#9e7550] mb-2 font-medium">Instagram Username</label>
          <input type="text" class="w-full bg-[#faf5ef] rounded-xl px-4 py-3 text-sm text-[#6b4f35] border-none outline-none focus:ring-1 focus:ring-[#c4a882] transition" placeholder="@username" />
        </div>
      </div>
    </div>

    <!-- Dynamic Cart Customization UI -->
    <div class="bg-white rounded-2xl p-5 shadow-[0_4px_20px_rgba(158,117,80,0.05)] border border-[#e8d8c8]/50">
      <h2 class="font-cormorant text-2xl italic text-[#6b4f35] mb-4">Customize Items</h2>
      <div id="dynamic-items" class="flex flex-col gap-5"></div>
    </div>
    
    <div class="mt-4">
      <button type="submit" class="w-full bg-[#9e7550] text-white text-[12px] tracking-[0.22em] uppercase py-4 rounded-xl hover:bg-[#7a5c3e] transition shadow-md font-medium">Continue to Payment</button>
    </div>
  </form>
</main>

<script>
  const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
  const container = document.getElementById("dynamic-items");
  if(cart.length === 0) { location.href="products.html"; }
  
  cart.forEach((it, i) => {
    const html = `<div class="pb-5 border-b border-[#e8d8c8]/50 last:border-0 last:pb-0">
      <div class="flex items-center gap-3 mb-3">
        <span class="w-5 h-5 rounded-full bg-[#faf5ef] text-[#9e7550] text-xs flex items-center justify-center font-medium">${it.qty}</span>
        <h3 class="font-medium text-[#6b4f35]">${it.name}</h3>
      </div>
      <div class="flex flex-col gap-3 pl-8">
        <input type="text" placeholder="Add a custom message..." class="w-full bg-[#faf5ef] rounded-xl px-4 py-2.5 text-sm text-[#6b4f35] outline-none focus:ring-1 focus:ring-[#c4a882]">
        <label class="flex items-center justify-center gap-2 border border-dashed border-[#c4a882] rounded-xl px-4 py-3 text-sm text-[#9e7550] hover:bg-[#faf5ef] cursor-pointer transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"></path></svg>
          Upload Reference Images
          <input type="file" multiple accept="image/*" class="hidden">
        </label>
      </div>
    </div>`;
    container.insertAdjacentHTML("beforeend", html);
  });
</script>
</body>
</html>
