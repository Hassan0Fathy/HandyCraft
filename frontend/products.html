<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse Handy Crafts handmade products — custom frames, books, birthday and baby gifts." />
  <title>Products · Handy Crafts</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: { dark:'#6b4f35', mid:'#9e7550', light:'#c4a882', pale:'#ecdccc', muted:'#b59070' },
            beige: { warm:'#f5ede3', soft:'#faf5ef', cream:'#fffdf9', dark:'#ede1d4' },
          },
          letterSpacing: { widest2:'0.22em', widest3:'0.28em' },
        },
      },
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { font-family: 'Jost', system-ui, sans-serif; font-weight: 300; }
    .font-cormorant { font-family: 'Cormorant Garamond', Georgia, serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: fadeUp .6s ease both; }
    .anim-2 { animation: fadeUp .6s .08s ease both; }
    .anim-3 { animation: fadeUp .6s .16s ease both; }

    /* Image zoom on card hover */
    .prod-card img { transition: transform .5s cubic-bezier(.4,0,.2,1); }
    .prod-card:hover img { transform: scale(1.07); }

    /* Hover Image Effect */
    .prod-image-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .prod-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease-out;
    }

    .prod-image-main {
      opacity: 1;
      z-index: 20;
    }

    .prod-image-hover {
      opacity: 0;
      z-index: 10;
    }

    @media (hover: hover) {
      .prod-card:hover .prod-image-main {
        opacity: 0;
        z-index: 10;
      }

      .prod-card:hover .prod-image-hover {
        opacity: 1;
        z-index: 20;
      }
    }

    /* Tab active state */
    .tab-active {
      background-color: #9e7550 !important;
      color: white !important;
      border-color: #9e7550 !important;
    }
  </style>
</head>
<body class="min-h-screen bg-[#fffdf9] text-[#6b4f35]">

  
  <!-- DYNAMIC NAVBAR INJECTION -->
  <div id="navbar-container"></div>
  <script>
    fetch("navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbar-container").innerHTML = html;
        const scripts = document.getElementById("navbar-container").getElementsByTagName("script");
        for (let s of scripts) {
          const newScript = document.createElement("script");
          if (s.src) {
            newScript.src = s.src;
          } else {
            newScript.textContent = s.textContent;
          }
          document.body.appendChild(newScript);
        }
      });
  </script>

      <option value="best-selling">Best Selling</option>
      <option value="price-low">Price: Low → High</option>

<!-- ═══════ FILTER TABS ═══════ -->
<div class="max-w-[520px] mx-auto px-6 mb-4 anim-2">
    <div class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:none;">
    </div>
  </div>

  <div id="subcategory-tabs" class="max-w-[520px] mx-auto px-6 mb-10 anim-2 hidden"></div>

  <!-- ═══════ PRODUCT GRID ═══════ -->
  <section class="max-w-7xl mx-auto px-6 pb-28 anim-3">
    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8" id="product-grid">
      <!-- Products will be rendered here by JavaScript -->
    </div>
    <div id="no-products-found" class="hidden text-center py-20">
      <p class="font-cormorant italic text-2xl text-[#9e7550]">No products found.</p>
      <p class="text-[11px] tracking-widest uppercase text-[#c4a882] mt-2">Try adjusting your search or filters</p>
    </div>
  </section>

  <!-- ═══════ FOOTER ═══════ -->

    <svg class="w-[26px] h-[26px] fill-white" viewBox="0 0 24 24">
      <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 1.98-6.98 6.344-.059 1.28-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 1.98 6.78 6.344 6.98 1.28.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-1.981 6.979-6.344.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-1.978-6.782-6.344-6.98-1.28-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
    </svg>

  <script>
    const API_BASE_URL = (window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api").replace(/\/$/, '');
    let allProducts = [];
    let categories = [];
    let subcategories = [];

    async function fetchData() {
      try {
        const [prodRes, catRes, subRes] = await Promise.all([
          fetch(`${API_BASE_URL}/products`),
          fetch(`${API_BASE_URL}/categories`),
          fetch(`${API_BASE_URL}/subcategories`)
        ]);
        
        const [prodData, catData, subData] = await Promise.all([
          prodRes.json(),
          catRes.json(),
          subRes.json()
        ]);
        
        allProducts = Array.isArray(prodData) ? prodData : (prodData.data || []);
        categories = (catData.data || []).filter(c => c.isActive).sort((a, b) => a.order - b.order);
        subcategories = (subData.data || []).filter(s => s.isActive);
        
        renderCategoryFilters();
        renderProducts();
      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    function renderCategoryFilters() {
      const container = document.querySelector('.flex.gap-2.overflow-x-auto');
      if (!container) return;
      
      container.innerHTML = `
        <button onclick="filterCat('all')" id="tab-all" class="filter-tab tab-active shrink-0 px-5 py-2.5 rounded-full text-[10px] tracking-[0.2em] uppercase border transition-all duration-200">All</button>
        ${categories.map(cat => `
          <button onclick="filterCat('${cat.name}')" id="tab-${cat.slug}" class="filter-tab shrink-0 px-5 py-2.5 rounded-full text-[10px] tracking-[0.2em] uppercase border border-[#ecdccc] text-[#c4a882] hover:border-[#9e7550] hover:text-[#9e7550] transition-all duration-200">
            ${cat.name}
          </button>
        `).join('')}
      `;
    }

    function renderSubcategoryFilters(catName) {
      const subcatContainer = document.getElementById('subcategory-tabs');
      if (!subcatContainer) return;
      
      if (catName === 'all') {
        subcatContainer.classList.add('hidden');
        return;
      }

      const cat = categories.find(c => c.name === catName);
      if (!cat) {
        subcatContainer.classList.add('hidden');
        return;
      }

      const subs = subcategories.filter(s => s.categoryId === cat._id);

      if (subs.length === 0) {
        subcatContainer.classList.add('hidden');
        return;
      }

      subcatContainer.classList.remove('hidden');
      subcatContainer.innerHTML = `
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" style="scrollbar-width:none;">
          <button onclick="filterSubCat('all')" id="subtab-all" class="subfilter-tab tab-active shrink-0 px-4 py-1.5 rounded-full text-[9px] tracking-[0.15em] uppercase border transition-all duration-200">All ${cat.name}</button>
          ${subs.map(sub => `
            <button onclick="filterSubCat('${sub.name}')" id="subtab-${sub.slug}" class="subfilter-tab shrink-0 px-4 py-1.5 rounded-full text-[9px] tracking-[0.15em] uppercase border border-[#ecdccc] text-[#c4a882] hover:border-[#9e7550] hover:text-[#9e7550] transition-all duration-200">${sub.name}</button>
          `).join('')}
        </div>
      `;
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = '';

      allProducts.forEach((product) => {
        if (product.status === 'hidden') return;

        let mainImage = 'images/placeholder.png';
        
        if (Array.isArray(product.images) && product.images.length > 0) {
          mainImage = window.getCloudinaryImageUrl(product.images[0], { w: 500, c: 'fill' });
        }

        const isOutOfStock = product.status === 'out-of-stock';

        const card = document.createElement('div');
        card.className = `prod-card group bg-white rounded-lg overflow-hidden ring-1 ring-[#ecdccc]/50 hover:ring-[#9e7550]/70 hover:shadow-xl transition-all duration-300 cursor-pointer ${isOutOfStock ? 'opacity-75' : ''}`;
        card.dataset.cat = product.category;
        card.dataset.subcat = product.subcategory || '';
        
        const searchTerms = [
          product.name,
          product.category,
          product.subcategory,
          product.sku
        ].filter(Boolean).join(' ').toLowerCase();
        card.dataset.searchText = searchTerms;

        card.onclick = () => window.location.href = `product-details.html?id=${encodeURIComponent(product._id)}`;

        card.innerHTML = `
          <div class="aspect-square overflow-hidden bg-[#f5ede3] relative">
            <img src="${mainImage}" alt="${product.name}" class="w-full h-full object-cover" loading="lazy" decoding="async" onerror="this.src='images/placeholder.png'" />
            ${isOutOfStock ? `
              <div class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-sm shadow-sm">
                Out of Stock
              </div>
            ` : ''}
          </div>
          <div class="p-4 md:p-5 flex flex-col">
            <h3 class="text-sm md:text-base font-medium text-[#6b4f35] mb-1 line-clamp-2">${product.name}</h3>
            <p class="text-xs md:text-sm text-[#9e7550] mb-3">${product.price} EGP</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    let currentCat = 'all';
    let currentSubCat = 'all';
    let searchQuery = '';
    let currentSort = 'featured';

    function sortProducts(products) {
      const sorted = [...products];
      switch (currentSort) {
        case 'featured':
          // Treat bestSeller as featured since there is no separate featured field
          return sorted.sort((a, b) => (b.bestSeller || false) - (a.bestSeller || false));
        case 'best-selling':
          return sorted.sort((a, b) => (b.bestSeller || false) - (a.bestSeller || false));
        case 'price-low':
          return sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
        case 'price-high':
          return sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
        case 'az':
          return sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        case 'newest':
          return sorted.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        default:
          return sorted;
      }
    }

    function updateDisplay() {
      const filtered = allProducts.filter(product => {
        if (product.status === 'hidden') return false;
        
        const matchesCat = currentCat === 'all' || product.category === currentCat;
        const matchesSubCat = currentSubCat === 'all' || product.subcategory === currentSubCat;
        
        const searchTerms = [
          product.name,
          product.category,
          product.subcategory,
          product.sku
        ].filter(Boolean).join(' ').toLowerCase();
        const matchesSearch = searchQuery === '' || searchTerms.includes(searchQuery.toLowerCase());
        
        return matchesCat && matchesSubCat && matchesSearch;
      });

      const sorted = sortProducts(filtered);
      renderProducts(sorted);
    }

    function renderProducts(productsToRender) {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = '';

      productsToRender.forEach((product) => {
        let mainImage = 'images/placeholder.png';
        if (Array.isArray(product.images) && product.images.length > 0) {
          mainImage = window.getCloudinaryImageUrl(product.images[0], { w: 500, c: 'fill' });
        }

        const isOutOfStock = product.status === 'out-of-stock';

        const card = document.createElement('div');
        card.className = `prod-card group bg-white rounded-lg overflow-hidden ring-1 ring-[#ecdccc]/50 hover:ring-[#9e7550]/70 hover:shadow-xl transition-all duration-300 cursor-pointer ${isOutOfStock ? 'opacity-75' : ''}`;
        
        card.onclick = () => window.location.href = `product-details.html?id=${encodeURIComponent(product._id)}`;

        card.innerHTML = `
          <div class="aspect-square overflow-hidden bg-[#f5ede3] relative">
            <img src="${mainImage}" alt="${product.name}" class="w-full h-full object-cover" loading="lazy" decoding="async" onerror="this.src='images/placeholder.png'" />
            ${isOutOfStock ? `
              <div class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-sm shadow-sm">
                Out of Stock
              </div>
            ` : ''}
          </div>
          <div class="p-4 md:p-5 flex flex-col">
            <h3 class="text-sm md:text-base font-medium text-[#6b4f35] mb-1 line-clamp-2">${product.name}</h3>
            <p class="text-xs md:text-sm text-[#9e7550] mb-3">${product.price} EGP</p>
          </div>
        `;
        grid.appendChild(card);
      });

      const emptyState = document.getElementById('no-products-found');
      if (emptyState) {
        emptyState.classList.toggle('hidden', productsToRender.length > 0);
      }
    }

    function filterCat(catName) {
      currentCat = catName;
      currentSubCat = 'all';

      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('tab-active'));
      const activeTab = catName === 'all' ? document.getElementById('tab-all') : document.getElementById(`tab-${categories.find(c => c.name === catName)?.slug}`);
      if(activeTab) activeTab.classList.add('tab-active');
      
      renderSubcategoryFilters(catName);
      updateDisplay();
    }

    function filterSubCat(subName) {
      currentSubCat = subName;
      document.querySelectorAll('.subfilter-tab').forEach(t => t.classList.remove('tab-active'));
      const activeTab = subName === 'all' ? document.getElementById('subtab-all') : document.getElementById(`subtab-${subcategories.find(s => s.name === subName)?.slug}`);
      if(activeTab) activeTab.classList.add('tab-active');
      
      updateDisplay();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      await fetchData();
      updateDisplay();

      const searchInput = document.getElementById('product-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          updateDisplay();
        });
      }

      const sortSelect = document.getElementById('product-sort');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          currentSort = e.target.value;
          updateDisplay();
        });
      }
    });


  </script>
</body>
</html>
