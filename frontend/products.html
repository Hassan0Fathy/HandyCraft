    @keyframes fadeUp {

      width: 100%;
      height: 100%;
    }

    .prod-image-container img {
      position: absolute;
      top: 0;
      left: 0;

      z-index: 10;

<script>
window.openDrawer = function() {
  const w = document.getElementById('mobile-drawer-wrapper');
  if(!w) return;
  w.classList.remove('pointer-events-none');
  document.getElementById('drawer-backdrop').classList.remove('opacity-0');
  document.getElementById('drawer-panel').classList.remove('-translate-x-full');
};
window.closeDrawer = function() {
  document.getElementById('drawer-backdrop').classList.add('opacity-0');
  document.getElementById('drawer-panel').classList.add('-translate-x-full');
  setTimeout(() => {
    const w = document.getElementById('mobile-drawer-wrapper');
    if(w) w.classList.add('pointer-events-none');
  }, 300);
};

window.toggleCategoryMenu = function() {
  const menu = document.getElementById('shop-categories-menu');
  const arrow = document.getElementById('shop-menu-arrow');
  menu.classList.toggle('hidden');
  arrow.classList.toggle('rotate-180');
};

// Proper navbar initialization with guard against duplicates
function initializeProductsNavbar() {
  const menuBtn = document.getElementById('menu-open-btn');
  if (menuBtn && !menuBtn.dataset.eventBound) {
    menuBtn.addEventListener('click', (e) => {
      e.preventDefault();
      window.openDrawer();
    });
    menuBtn.dataset.eventBound = 'true';
  }
  
  window.updateCartBadge();
}

window.updateCartBadge = function() {
    try {
        const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
        const count = cart.reduce((sum, item) => sum + (item.qty||item.quantity||1), 0);
        const badges = document.querySelectorAll("#cart-badge-nav");
        badges.forEach(b => {
            if(count > 0) { b.textContent = count; b.classList.remove('hidden'); }
            else b.classList.add('hidden');
        });
    } catch(e){}
};

// Wait for DOM to be ready before initializing
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeProductsNavbar);
} else {
  initializeProductsNavbar();
}
</script>

    </svg>
  </a>

  <script>
    const API_BASE_URL = (window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api").replace(/\/$/, '');
    let allProducts = [];
    let categories = [];
    let subcategories = [];

    async function fetchData() {
      try {
        const [prodRes, catRes, subRes] = await Promise.all([
          fetch(`${API_BASE_URL}/products`),
          fetch(`${API_BASE_URL}/categories`),
          fetch(`${API_BASE_URL}/subcategories`)
        ]);
        
        const [prodData, catData, subData] = await Promise.all([
          prodRes.json(),
          catRes.json(),
          subRes.json()
        ]);
        
        allProducts = Array.isArray(prodData) ? prodData : (prodData.data || []);
        categories = (catData.data || []).filter(c => c.isActive).sort((a, b) => a.order - b.order);
        subcategories = (subData.data || []).filter(s => s.isActive);
        
        renderCategoryFilters();
        renderProducts();
      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    function renderCategoryFilters() {
      const container = document.querySelector('.flex.gap-2.overflow-x-auto');
      if (!container) return;
      
      container.innerHTML = `
        <button onclick="filterCat('all')" id="tab-all" class="filter-tab tab-active shrink-0 px-5 py-2.5 rounded-full text-[10px] tracking-[0.2em] uppercase border transition-all duration-200">All</button>
        ${categories.map(cat => `
          <button onclick="filterCat('${cat.name}')" id="tab-${cat.slug}" class="filter-tab shrink-0 px-5 py-2.5 rounded-full text-[10px] tracking-[0.2em] uppercase border border-[#ecdccc] text-[#c4a882] hover:border-[#9e7550] hover:text-[#9e7550] transition-all duration-200">
            ${cat.name}
          </button>
        `).join('')}
      `;
    }

    function renderSubcategoryFilters(catName) {
      const subcatContainer = document.getElementById('subcategory-tabs');
      if (!subcatContainer) return;
      
      if (catName === 'all') {
        subcatContainer.classList.add('hidden');
        return;
      }

      const cat = categories.find(c => c.name === catName);
      if (!cat) {
        subcatContainer.classList.add('hidden');
        return;
      }

      const subs = subcategories.filter(s => s.categoryId === cat._id);

      if (subs.length === 0) {
        subcatContainer.classList.add('hidden');
        return;
      }

      subcatContainer.classList.remove('hidden');
      subcatContainer.innerHTML = `
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" style="scrollbar-width:none;">
          <button onclick="filterSubCat('all')" id="subtab-all" class="subfilter-tab tab-active shrink-0 px-4 py-1.5 rounded-full text-[9px] tracking-[0.15em] uppercase border transition-all duration-200">All ${cat.name}</button>
          ${subs.map(sub => `
            <button onclick="filterSubCat('${sub.name}')" id="subtab-${sub.slug}" class="subfilter-tab shrink-0 px-4 py-1.5 rounded-full text-[9px] tracking-[0.15em] uppercase border border-[#ecdccc] text-[#c4a882] hover:border-[#9e7550] hover:text-[#9e7550] transition-all duration-200">${sub.name}</button>
          `).join('')}
        </div>
      `;
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = '';

      allProducts.forEach((product) => {
        if (product.status === 'hidden') return;

        let mainImage = 'images/placeholder.png';
        
        if (Array.isArray(product.images) && product.images.length > 0) {
          mainImage = product.images[0];
        }

        const isOutOfStock = product.status === 'out-of-stock';

        const card = document.createElement('div');
        card.className = `prod-card group bg-white rounded-lg overflow-hidden ring-1 ring-[#ecdccc]/50 hover:ring-[#9e7550]/70 hover:shadow-xl transition-all duration-300 cursor-pointer ${isOutOfStock ? 'opacity-75' : ''}`;
        card.dataset.cat = product.category;
        card.dataset.subcat = product.subcategory || '';
        
        const searchTerms = [
          product.name,
          product.category,
          product.subcategory,
          product.sku
        ].filter(Boolean).join(' ').toLowerCase();
        card.dataset.searchText = searchTerms;

        card.onclick = () => window.location.href = `product-details.html?id=${encodeURIComponent(product._id)}`;

        card.innerHTML = `
          <div class="aspect-square overflow-hidden bg-[#f5ede3] relative">
            <img src="${mainImage}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.src='images/placeholder.png'" />
            ${isOutOfStock ? `
              <div class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-sm shadow-sm">
                Out of Stock
              </div>
            ` : ''}
          </div>
          <div class="p-4 md:p-5 flex flex-col">
            <h3 class="text-sm md:text-base font-medium text-[#6b4f35] mb-1 line-clamp-2">${product.name}</h3>
            <p class="text-xs md:text-sm text-[#9e7550] mb-3">${product.price} EGP</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    let currentCat = 'all';
    let currentSubCat = 'all';
    let searchQuery = '';
    let currentSort = 'featured';

    function sortProducts(products) {
      const sorted = [...products];
      switch (currentSort) {
        case 'featured':
          // Treat bestSeller as featured since there is no separate featured field
          return sorted.sort((a, b) => (b.bestSeller || false) - (a.bestSeller || false));
        case 'best-selling':
          return sorted.sort((a, b) => (b.bestSeller || false) - (a.bestSeller || false));
        case 'price-low':
          return sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
        case 'price-high':
          return sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
        case 'az':
          return sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        case 'newest':
          return sorted.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        default:
          return sorted;
      }
    }

    function updateDisplay() {
      const filtered = allProducts.filter(product => {
        if (product.status === 'hidden') return false;
        
        const matchesCat = currentCat === 'all' || product.category === currentCat;
        const matchesSubCat = currentSubCat === 'all' || product.subcategory === currentSubCat;
        
        const searchTerms = [
          product.name,
          product.category,
          product.subcategory,
          product.sku
        ].filter(Boolean).join(' ').toLowerCase();
        const matchesSearch = searchQuery === '' || searchTerms.includes(searchQuery.toLowerCase());
        
        return matchesCat && matchesSubCat && matchesSearch;
      });

      const sorted = sortProducts(filtered);
      renderProducts(sorted);
    }

    function renderProducts(productsToRender) {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = '';

      productsToRender.forEach((product) => {
        let mainImage = 'images/placeholder.png';
        if (Array.isArray(product.images) && product.images.length > 0) {
          mainImage = product.images[0];
        }

        const isOutOfStock = product.status === 'out-of-stock';

        const card = document.createElement('div');
        card.className = `prod-card group bg-white rounded-lg overflow-hidden ring-1 ring-[#ecdccc]/50 hover:ring-[#9e7550]/70 hover:shadow-xl transition-all duration-300 cursor-pointer ${isOutOfStock ? 'opacity-75' : ''}`;
        
        card.onclick = () => window.location.href = `product-details.html?id=${encodeURIComponent(product._id)}`;

        card.innerHTML = `
          <div class="aspect-square overflow-hidden bg-[#f5ede3] relative">
            <img src="${mainImage}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.src='images/placeholder.png'" />
            ${isOutOfStock ? `
              <div class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-sm shadow-sm">
                Out of Stock
              </div>
            ` : ''}
          </div>
          <div class="p-4 md:p-5 flex flex-col">
            <h3 class="text-sm md:text-base font-medium text-[#6b4f35] mb-1 line-clamp-2">${product.name}</h3>
            <p class="text-xs md:text-sm text-[#9e7550] mb-3">${product.price} EGP</p>
          </div>
        `;
        grid.appendChild(card);
      });

      const emptyState = document.getElementById('no-products-found');
      if (emptyState) {
        emptyState.classList.toggle('hidden', productsToRender.length > 0);
      }
    }

    function filterCat(catName) {
      currentCat = catName;
      currentSubCat = 'all';

      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('tab-active'));
      const activeTab = catName === 'all' ? document.getElementById('tab-all') : document.getElementById(`tab-${categories.find(c => c.name === catName)?.slug}`);
      if(activeTab) activeTab.classList.add('tab-active');
      
      renderSubcategoryFilters(catName);
      updateDisplay();
    }

    function filterSubCat(subName) {
      currentSubCat = subName;
      document.querySelectorAll('.subfilter-tab').forEach(t => t.classList.remove('tab-active'));
      const activeTab = subName === 'all' ? document.getElementById('subtab-all') : document.getElementById(`subtab-${subcategories.find(s => s.name === subName)?.slug}`);
      if(activeTab) activeTab.classList.add('tab-active');
      
      updateDisplay();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
      const searchInput = document.getElementById('product-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          updateDisplay();
        });
      }

      const sortSelect = document.getElementById('product-sort');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          currentSort = e.target.value;
          updateDisplay();
        });
      }
    });


  </script>
</body>
</html>
