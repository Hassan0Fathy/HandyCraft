<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders · Handy Crafts Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: { dark:'#6b4f35', mid:'#9e7550', light:'#c4a882', pale:'#ecdccc', muted:'#b59070' },
            beige: { warm:'#f5ede3', soft:'#faf5ef', cream:'#fffdf9' },
          },
        },
      },
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
    body { font-family: 'Jost', system-ui, sans-serif; font-weight: 300; background: #fffdf9; color: #6b4f35; }
    .font-cormorant { font-family: 'Cormorant Garamond', Georgia, serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim { animation: fadeUp .5s ease both; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.7);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      cursor: pointer;
    }
    .lightbox img {
      max-width: 90%; max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- ═══════ NAVBAR ═══════ -->
  

  <!-- DYNAMIC NAVBAR INJECTION -->
  <div id="navbar-container"></div>
  <script>
    fetch("navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbar-container").innerHTML = html;
        const scripts = document.getElementById("navbar-container").getElementsByTagName("script");
        for (let s of scripts) {
          const newScript = document.createElement("script");
          if (s.src) {
            newScript.src = s.src;
          } else {
            newScript.textContent = s.textContent;
          }
          document.body.appendChild(newScript);
        }
      });
  </script>







<section class="max-w-3xl mx-auto px-6 pb-20" id="orders-container">
    <!-- Populated by JS -->
  </section>

  <!-- ═══════ EMPTY STATE ═══════ -->
  <div id="empty-state" class="max-w-3xl mx-auto px-6 py-20 text-center hidden">
    <p class="text-5xl mb-6">📭</p>
    <p class="font-cormorant italic text-2xl text-[#c4a882] mb-2">No orders yet</p>
    <p class="text-[12px] text-[#c4a882] tracking-wider">Orders submitted from the order form will appear here.</p>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       Handy Crafts — Admin Orders View
       ═══════════════════════════════════════════ */

    // ── Load orders from localStorage ─────────
    function getOrders() {
      return JSON.parse(localStorage.getItem('hc_orders') || '[]');
    }

    // ── Delete a single order ─────────────────
    function deleteOrder(id) {
      const orders = getOrders().filter(o => o.id !== id);
      localStorage.setItem('hc_orders', JSON.stringify(orders));
      renderOrders();
    }

    // ── Clear all orders ──────────────────────
    function clearAllOrders() {
      if (!confirm('Delete all orders? This cannot be undone.')) return;
      localStorage.removeItem('hc_orders');
      renderOrders();
    }

    // ── Open image lightbox ───────────────────
    function openLightbox(src) {
      const lb = document.createElement('div');
      lb.className = 'lightbox';
      lb.innerHTML = `<img src="${src}" alt="Full image" />`;
      lb.addEventListener('click', () => lb.remove());
      document.body.appendChild(lb);
    }

    // ── Render all orders ─────────────────────
    function renderOrders() {
      const orders    = getOrders();
      const container = document.getElementById('orders-container');
      const empty     = document.getElementById('empty-state');
      const countEl   = document.getElementById('order-count');
      const clearBtn  = document.getElementById('clear-btn');

      container.innerHTML = '';

      if (!orders.length) {
        empty.classList.remove('hidden');
        countEl.textContent = '';
        clearBtn.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      countEl.textContent = `${orders.length} order${orders.length > 1 ? 's' : ''}`;
      clearBtn.classList.remove('hidden');

      // Newest first
      orders.reverse().forEach((order, i) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl ring-1 ring-[#ecdccc]/60 shadow-sm mb-5 overflow-hidden anim';
        card.style.animationDelay = `${i * 0.05}s`;

        // Build images HTML
        let imagesHtml = '';
        if (order.images && order.images.length) {
          imagesHtml = `
            <div class="mt-4">
              <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882] mb-2">Reference Images</p>
              <div class="flex flex-wrap gap-2">
                ${order.images.map(src => `
                  <img src="${src}" alt="Reference"
                       class="w-16 h-16 object-cover rounded-lg ring-1 ring-[#ecdccc] cursor-pointer hover:ring-[#c4a882] transition"
                       onclick="openLightbox('${src}')" />
                `).join('')}
              </div>
            </div>
          `;
        }

        // Build payment HTML
        let paymentHtml = '';
        if (order.payment) {
          paymentHtml = `
            <div class="mt-4">
              <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882] mb-2">Payment Receipt</p>
              <img src="${order.payment}" alt="Payment"
                   class="w-28 h-auto rounded-lg ring-1 ring-[#ecdccc] cursor-pointer hover:ring-[#c4a882] transition"
                   onclick="openLightbox('${order.payment}')" />
            </div>
          `;
        }

        card.innerHTML = `
          <!-- Header -->
          <div class="flex items-center justify-between bg-[#faf5ef] px-5 py-3 border-b border-[#ecdccc]/50">
            <div class="flex items-center gap-3">
              <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-[#9e7550] text-white text-[11px] font-medium">
                ${order.name ? order.name.charAt(0).toUpperCase() : '?'}
              </span>
              <div>
                <p class="text-[13px] font-medium text-[#6b4f35]">${escapeHtml(order.name || '—')}</p>
                <p class="text-[10px] text-[#c4a882] tracking-wider">${(() => { const d = new Date(order.date || ''); return isNaN(d.getTime()) ? '' : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; })()}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-[10px] tracking-[0.18em] uppercase bg-[#f5ede3] text-[#9e7550] px-3 py-1 rounded-full">
                ${escapeHtml(order.category || '—')}
              </span>
              <button onclick="deleteOrder(${order.id})" title="Delete order"
                      class="text-[#ecdccc] hover:text-red-400 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Body -->
          <div class="px-5 py-4">
            <!-- Info grid -->
            <div class="grid grid-cols-2 gap-x-6 gap-y-3">
              <div>
                <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882]">Phone</p>
                <p class="text-[13px] text-[#6b4f35] mt-0.5">${escapeHtml(order.phone || '—')}</p>
              </div>
              <div>
                <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882]">Instagram</p>
                <p class="text-[13px] text-[#6b4f35] mt-0.5">${order.instagram ? '@' + escapeHtml(order.instagram.replace('@','')) : '—'}</p>
              </div>
            </div>

            ${order.details ? `
              <div class="mt-4">
                <p class="text-[10px] tracking-[0.2em] uppercase text-[#c4a882] mb-1">Details</p>
                <p class="text-[13px] text-[#6b4f35] leading-relaxed bg-[#faf5ef] rounded-xl px-4 py-3">${escapeHtml(order.details)}</p>
              </div>
            ` : ''}

            ${imagesHtml}
            ${paymentHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // ── Escape HTML to prevent XSS ────────────
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Init ──────────────────────────────────
    renderOrders();
  </script>

</body>
</html>
