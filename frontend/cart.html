<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Handy Crafts</title>
  <script src="config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: { dark:'#6b4f35', mid:'#9e7550', light:'#c4a882', pale:'#ecdccc', muted:'#b59070' },
            beige: { warm:'#f5ede3', soft:'#faf5ef', cream:'#fffdf9', dark:'#ede1d4' }
          },
          letterSpacing: { widest2: '0.22em', widest3: '0.28em' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Jost', sans-serif; background-color: #fffdf9; color: #4a3728; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }
    @keyframes slideUpCart { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; }}
    .cart-item-anim { animation: slideUpCart 0.4s ease-out forwards; opacity: 0; }
  </style>
</head>
<body class="min-h-screen pb-20 bg-[#fffdf9]">


  <!-- DYNAMIC NAVBAR INJECTION -->
  <div id="navbar-container"></div>
  <script>
    fetch("navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbar-container").innerHTML = html;
        const scripts = document.getElementById("navbar-container").getElementsByTagName("script");
        for (let s of scripts) {
          const newScript = document.createElement("script");
          if (s.src) {
            newScript.src = s.src;
          } else {
            newScript.textContent = s.textContent;
          }
          document.body.appendChild(newScript);
        }
      });
  </script>


<main class="max-w-[520px] mx-auto px-5 pt-8">
  <h1 class="font-cormorant text-4xl italic text-brown-dark mb-8 text-center">Cart</h1>

  <div id="cart-items" class="flex flex-col gap-6 mb-10"></div>

  <div id="cart-summary" class="border-t border-brown-pale/50 pt-6 mb-10 hidden">
    <!-- PROMO CODE SECTION -->
    <div class="mb-6 p-4 bg-beige-warm/30 rounded-xl border border-brown-pale/30">
      <label class="block text-[10px] uppercase tracking-widest text-[#9e7550] mb-2 font-medium">Promo Code</label>
      <div class="flex gap-2">
        <input type="text" id="promo-input" class="w-full rounded-lg border border-brown-pale px-3 py-2 text-sm focus:outline-none focus:border-[#9e7550] uppercase" placeholder="Enter code">
        <button onclick="applyPromo()" class="bg-[#9e7550] text-white px-4 py-2 rounded-lg text-xs uppercase tracking-widest font-medium hover:bg-[#7a5c3e] transition">Apply</button>
      </div>
      <p id="promo-message" class="text-[11px] mt-2 hidden"></p>
    </div>

    <div class="flex justify-between font-medium text-lg text-brown-dark mb-6">
      <span>Total</span>
      <span id="cart-total"></span>
    </div>
    <div class="flex flex-col gap-3">
      <button onclick="location.href='payment.html'" class="w-full relative group overflow-hidden bg-[#9e7550] text-white text-[12px] tracking-[0.22em] uppercase py-4.5 rounded-xl hover:bg-[#7a5c3e] transition-all duration-300 shadow-md hover:shadow-lg font-medium active:scale-[0.99]" style="padding-top:1.1rem; padding-bottom:1.1rem;">
        <span class="relative z-10">Checkout</span>
        <div class="absolute inset-0 h-full w-0 bg-white/20 transition-all duration-300 ease-out group-hover:w-full z-0"></div>
      </button>
      <button onclick="location.href='products.html'" class="w-full border-2 border-[#e8d8c8] text-[#9e7550] text-[12px] tracking-[0.22em] uppercase py-4 rounded-xl hover:bg-[#faf5ef] hover:border-[#c4a882] transition-colors font-medium">Continue Shopping</button>
    </div>
  </div>

  <div id="empty-cart" class="text-center py-16 hidden">
    <p class="text-brown-light text-lg mb-6" style="color:#b09882;">Your cart is beautiful, but empty.</p>
    <button onclick="location.href='products.html'" class="bg-[#9e7550] text-white text-[11px] tracking-[0.22em] uppercase px-8 py-3 rounded-full hover:bg-[#7a5c3e] transition shadow-sm">Shop Now</button>
  </div>
</main>

<!-- Customization Choice Modal -->
<div id="custom-choice-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-5 hidden">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeCustomModal()"></div>
  <div class="bg-white rounded-3xl w-full max-w-[400px] overflow-hidden shadow-2xl relative z-10 anim-modal-up">
    <div class="p-8">
      <h2 class="font-cormorant text-3xl italic text-[#6b4f35] mb-3 text-center">Add Another Item</h2>
      <p class="text-[#9e7550] text-sm text-center leading-relaxed mb-8">
        Would you like another copy of the same design or create a new design?
      </p>
      
      <div class="flex flex-col gap-3">
        <button onclick="handleSameDesign()" class="w-full bg-[#9e7550] text-white py-4 rounded-2xl text-[12px] uppercase tracking-widest hover:bg-[#7a5c3e] transition font-medium shadow-sm flex items-center justify-center gap-2">
          <span>✓ Same Design</span>
        </button>
        <button onclick="handleNewDesign()" class="w-full border-2 border-[#ecdccc] text-[#9e7550] py-4 rounded-2xl text-[12px] uppercase tracking-widest hover:bg-[#faf5ef] transition font-medium flex items-center justify-center gap-2">
          <span>➕ Create New Design</span>
        </button>
        <button onclick="closeCustomModal()" class="w-full text-[#c4a882] py-3 text-[11px] uppercase tracking-widest hover:text-[#9e7550] transition font-medium">
          ✕ Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes modalUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .anim-modal-up { animation: modalUp 0.3s ease-out; }
</style>

<script>
  // IndexedDB Helper
  const DB_NAME = 'HandyCraftDB';
  const STORE_NAME = 'cartImages';
  let db = null;

  async function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function getImagesFromIndexedDB(cartItemId) {
    if (!db) await initIndexedDB();
    return new Promise((resolve) => {
      try {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(cartItemId);
        request.onsuccess = () => resolve(request.result?.images || []);
        request.onerror = () => resolve([]);
      } catch (err) {
        resolve([]);
      }
    });
  }

  async function deleteImagesFromIndexedDB(cartItemId) {
    if (!db) await initIndexedDB();
    return new Promise((resolve) => {
      try {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(cartItemId);
        request.onsuccess = () => resolve();
        request.onerror = () => resolve();
      } catch (err) {
        resolve();
      }
    });
  }

  // Initialize IndexedDB
  initIndexedDB().catch(err => console.warn('IndexedDB not available:', err));

  let cart = JSON.parse(localStorage.getItem('hc_cart') || '[]');
</script>

<script>
  // Dynamic Shipping Configuration
  const SHIPPING_CONFIG = {
    SPECIAL_SHIPPING_SUBCATEGORY_SLUG: 'frames',
    SPECIAL_SHIPPING_COST_CAIRO_GIZA: 200,
    SPECIAL_SHIPPING_COST_OTHER: 250,
    DEFAULT_SHIPPING_COST_CAIRO_GIZA: 75,
    DEFAULT_SHIPPING_COST_OTHER: 120
  };

  function calculateShipping(cartItems, governorate) {
    if (!cartItems || cartItems.length === 0) return 0;

    const gov = (governorate || 'Cairo').toLowerCase();
    const isCairoGiza = gov === 'cairo' || gov === 'giza';

    const hasSpecialItem = cartItems.some(item => {
      const subSlug = (item.subcategorySlug || item.subcategory || '').toLowerCase();
      return subSlug === SHIPPING_CONFIG.SPECIAL_SHIPPING_SUBCATEGORY_SLUG;
    });

    if (hasSpecialItem) {
      return isCairoGiza ? SHIPPING_CONFIG.SPECIAL_SHIPPING_COST_CAIRO_GIZA : SHIPPING_CONFIG.SPECIAL_SHIPPING_COST_OTHER;
    } else {
      return isCairoGiza ? SHIPPING_CONFIG.DEFAULT_SHIPPING_COST_CAIRO_GIZA : SHIPPING_CONFIG.DEFAULT_SHIPPING_COST_OTHER;
    }
  }
</script>

<script>
    let appliedPromo = null;

    async function applyPromo() {
      const codeInput = document.getElementById('promo-input');
      const messageEl = document.getElementById('promo-message');
      const code = codeInput.value.trim();
      
      if (!code) {
        showMessage('Please enter a promo code', 'text-red-500');
        return;
      }

      const orderAmount = cart.reduce((sum, it) => sum + (it.price * (it.qty || 1)), 0);

      try {
        const response = await fetch(`${window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api"}/promos/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, orderAmount })
        });

        const data = await response.json();
        
        if (!response.ok) {
          showMessage(data.message, 'text-red-500');
          appliedPromo = null;
        } else {
          appliedPromo = data;
          showMessage(`Promo '${data.code}' applied successfully!`, 'text-green-600');
        }
        renderCart();
      } catch (error) {
        showMessage('Failed to apply promo code', 'text-red-500');
      }
    }

    function showMessage(msg, colorClass) {
      const el = document.getElementById('promo-message');
      el.textContent = msg;
      el.className = `text-[11px] mt-2 ${colorClass}`;
      el.classList.remove('hidden');
    }

    async function renderCart() {
      const c = document.getElementById('cart-items');
      const s = document.getElementById('cart-summary');
      const e = document.getElementById('empty-cart');
      c.innerHTML = '';

      if(!cart.length) { s.classList.add('hidden'); e.classList.remove('hidden'); return; }
      e.classList.add('hidden'); s.classList.remove('hidden');

      let itemsTotal = 0;
      for (let i = 0; i < cart.length; i++) {
        const it = cart[i];
        const qty = it.qty || 1;
        itemsTotal += it.price * qty;

        // Load images from IndexedDB if available
        let customImages = it.customization?.images || [];
        if (it.hasImages) {
          const idbImages = await getImagesFromIndexedDB(it.id);
          if (idbImages.length > 0) {
            customImages = idbImages;
          }
        }

        c.insertAdjacentHTML('beforeend', 
        '<div class="cart-item-anim flex gap-4 p-4 rounded-2xl bg-white shadow-sm hover:shadow-[0_8px_30px_rgba(158,117,80,0.08)] border border-[#e8d8c8]/60 transition-all duration-300 transform" style="animation-delay: ' + (i * 0.1) + 's;">' +
          '<div class="w-20 h-20 rounded-xl overflow-hidden bg-[#faf5ef] shrink-0 border border-[#e8d8c8]/40">' +
            '<img src="' + (it.img || it.image || 'images/placeholder.png') + '" class="w-full h-full object-cover transition-transform duration-700 hover:scale-110" onerror="this.src=\'images/placeholder.png\'">' +
          '</div>' +
          '<div class="flex flex-col grow justify-between py-0.5">' +
            '<div class="flex justify-between items-start">' +
              '<h3 class="font-medium text-[#4a3728] text-sm leading-tight max-w-[80%]">' + it.name + '</h3>' +
              '<button onclick="removeFromCart(\'' + it.id + '\')" class="text-[#c4a882] hover:text-red-500 transition-colors p-1" aria-label="Remove item">' +
                '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-width="1.5"/></svg>' +
              '</button>' +
            '</div>' +
            (it.messages ? 
            '<div class="text-[10px] text-[#9e7550] mt-1.5 space-y-0.5 line-clamp-2">' +
              '<span class="font-medium">Love:</span> ' + it.messages.love + ' | ' +
              '<span class="font-medium">Story:</span> ' + it.messages.story + ' | ' +
              '<span class="font-medium">Proud:</span> ' + it.messages.proud + ' | ' +
              '<span class="font-medium">Song:</span> ' + it.messages.song + 
            '</div>' : '') +
            (customImages && customImages.length ? 
            '<div class="flex gap-1 mt-1.5 overflow-x-auto pb-1">' +
              customImages.map(img => '<img src="' + img + '" class="w-8 h-8 object-cover rounded-md border border-[#e8d8c8]" onerror="this.src=\'images/placeholder.png\'" />').join('') +
            '</div>' : '') +
            '<div class="flex justify-between items-center mt-2">' +
              '<div class="flex items-center bg-[#faf5ef] rounded-[10px] px-1 py-1 border border-[#e8d8c8]">' +
                '<button onclick="updateQty(\'' + it.id + '\', -1)" class="w-7 h-7 text-[#9e7550] hover:bg-white rounded-md transition-colors font-medium">-</button>' +
                '<span class="text-[13px] w-6 text-center text-[#4a3728] font-medium pointer-events-none">' + qty + '</span>' +
                '<button onclick="updateQty(\'' + it.id + '\', 1)" class="w-7 h-7 text-[#9e7550] hover:bg-white rounded-md transition-colors font-medium">+</button>' +
              '</div>' +
              '<span class="font-medium text-[#9e7550] text-[15px]">EGP ' + it.price + '</span>' +
            '</div>' +
          '</div>' +
        '</div>');
      }

      const shipping = calculateShipping(cart);
      const discount = appliedPromo ? appliedPromo.discountAmount : 0;
      const total = Math.max(0, itemsTotal - discount + shipping);

      let totalHtml = `
        <div class="text-right">
          <div class="text-[12px] text-brown-mid mb-1">Subtotal: EGP ${itemsTotal.toFixed(2)}</div>
          ${discount > 0 ? `<div class="text-[12px] text-green-600 mb-1">Discount (${appliedPromo.code}): -EGP ${discount.toFixed(2)}</div>` : ''}
          <div class="text-[12px] text-brown-mid mb-1">Delivery Fee: EGP ${shipping.toFixed(2)}</div>
          <div class="text-lg font-bold">Total: EGP ${total.toFixed(2)}</div>
        </div>
      `;

      document.getElementById('cart-total').innerHTML = totalHtml;
      localStorage.setItem('hc_cart', JSON.stringify(cart));

      // Update badge
      updateCartBadge();
    }
  </script>

  <script>
  let pendingQtyUpdateId = null;

  function openCustomModal() {
    const modal = document.getElementById('custom-choice-modal');
    if (modal) {
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeCustomModal() {
    const modal = document.getElementById('custom-choice-modal');
    if (modal) {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }
    pendingQtyUpdateId = null;
  }

  function isProductCustomized(item) {
    if (!item) return false;

    // 1. Check if it has images (linked in IndexedDB)
    if (item.hasImages) return true;

    // 2. Check if it has any non-empty text customization fields
    if (item.customization) {
      const hasTextFields = Object.keys(item.customization).some(key => 
        key !== 'images' && 
        item.customization[key] !== null &&
        String(item.customization[key]).trim() !== ""
      );
      if (hasTextFields) return true;
    }

    // 3. Check for specific message fields (used by legacy products)
    if (item.messages) {
      const hasMessages = Object.values(item.messages).some(val => 
        val !== null &&
        String(val).trim() !== ""
      );
      if (hasMessages) return true;
    }

    return false;
  }

  function updateQty(targetId, d) { 
    const item = cart.find(it => (it.cartId || it.id) === targetId);
    if (!item) return;

    // Trigger modal ONLY when INCREASING quantity of a CUSTOMIZED product
    if (d > 0 && isProductCustomized(item)) {
      pendingQtyUpdateId = targetId;
      openCustomModal();
      return;
    }

    applyQtyUpdate(targetId, d);
  }

  function applyQtyUpdate(targetId, d) {
    const item = cart.find(it => (it.cartId || it.id) === targetId);
    if(item) {
      const newQty = (item.qty || 1) + d;
      if(newQty > 0) {
        item.qty = newQty;
      } else {
        deleteImagesFromIndexedDB(item.cartId || item.id);
        cart = cart.filter(it => (it.cartId || it.id) !== targetId);
      }
      localStorage.setItem('hc_cart', JSON.stringify(cart));
      renderCart();
    }
  }

  function handleSameDesign() {
    if (pendingQtyUpdateId) {
      applyQtyUpdate(pendingQtyUpdateId, 1);
      closeCustomModal();
    }
  }

  function handleNewDesign() {
    if (pendingQtyUpdateId) {
      const item = cart.find(it => (it.cartId || it.id) === pendingQtyUpdateId);
      if (item) {
        const productId = item.baseId || item.id;
        location.href = `product-details.html?id=${productId}&newDesign=true`;
      }
    }
  }

  function removeFromCart(targetId) {
    const item = cart.find(it => (it.cartId || it.id) === targetId);
    if(item) {
      deleteImagesFromIndexedDB(item.cartId || item.id);
      cart = cart.filter(it => (it.cartId || it.id) !== targetId);
      localStorage.setItem('hc_cart', JSON.stringify(cart));
      renderCart();
    }
  }

  function updateCartBadge() {
    try {
      const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
      const badges = document.querySelectorAll("#cart-badge-nav");
      badges.forEach(b => {
        if (count > 0) { b.textContent = count; b.classList.remove('hidden'); }
        else b.classList.add('hidden');
      });
    } catch(e) {}
  }

  renderCart();
  </script>

</body>
</html>
