<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Handy Crafts</title>
  <script src="config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: { dark:'#6b4f35', mid:'#9e7550', light:'#c4a882', pale:'#ecdccc', muted:'#b59070' },
            beige: { warm:'#f5ede3', soft:'#faf5ef', cream:'#fffdf9', dark:'#ede1d4' }
          },
          letterSpacing: { widest2: '0.22em', widest3: '0.28em' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Jost', sans-serif; background-color: #fffdf9; color: #4a3728; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }
    @keyframes slideUpCart { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; }}
    .cart-item-anim { animation: slideUpCart 0.4s ease-out forwards; opacity: 0; }
  </style>
</head>
<body class="min-h-screen pb-20 bg-[#fffdf9]">

<nav class="sticky top-0 z-50 bg-[#fffdf9]/95 backdrop-blur-md border-b border-[#ecdccc]/60">
<div class="max-w-[520px] md:max-w-4xl lg:max-w-6xl xl:max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
  
  <div class="flex items-center w-1/4">
    <button id="menu-open-btn" aria-label="Open Menu" class="text-[#9e7550] hover:text-[#6b4f35] transition-colors p-1 -ml-1">
      <svg class="w-[26px] h-[26px]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </div>

  <div class="w-2/4 flex justify-center">
    <button id="logo-btn" class="flex flex-col items-center group" type="button">
      <img src="images/logo.png" alt="Handy Crafts" class="h-10 sm:h-12 w-auto transition-transform duration-500 group-hover:scale-105" 
        onerror="this.style.display='none';document.getElementById('logo-nav-txt').classList.remove('hidden')" />
      <span id="logo-nav-txt" class="font-cormorant text-xl italic text-brown-mid leading-none hidden">
        Handy crafts
      </span>
    </button>
  </div>

  <div class="flex items-center justify-end w-1/4 gap-3 sm:gap-4">
    <a href="https://www.instagram.com/handy_crafts1_/" target="_blank" aria-label="Instagram" class="text-[#c4a882] hover:text-[#9e7550] transition-colors hidden sm:block">
      <svg class="w-[22px] h-[22px] fill-current" viewBox="0 0 24 24">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 1.98-6.98 6.344-.059 1.28-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 1.98 6.78 6.344 6.98 1.28.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-1.981 6.979-6.344.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-1.978-6.782-6.344-6.98-1.28-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
    </a>
    <a href="cart.html" aria-label="Cart" class="relative text-[#9e7550] hover:text-[#6b4f35] transition-colors p-1 -mr-1">
      <svg class="w-[26px] h-[26px]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
      <span id="cart-badge-nav" class="absolute top-0 right-0 bg-[#6b4f35] text-white text-[9px] font-medium w-[18px] h-[18px] rounded-full flex items-center justify-center translate-x-1.5 -translate-y-1 shadow-sm hidden">
        0
      </span>
    </a>
  </div>
</div>
</nav>

<main class="max-w-[520px] mx-auto px-5 pt-8">
  <h1 class="font-cormorant text-4xl italic text-brown-dark mb-8 text-center">Cart</h1>

  <div id="cart-items" class="flex flex-col gap-6 mb-10"></div>

  <div id="cart-summary" class="border-t border-brown-pale/50 pt-6 mb-10 hidden">
    <div class="flex justify-between font-medium text-lg text-brown-dark mb-6">
      <span>Total</span>
      <span id="cart-total"></span>
    </div>
    <div class="flex flex-col gap-3">
      <button onclick="location.href='payment.html'" class="w-full relative group overflow-hidden bg-[#9e7550] text-white text-[12px] tracking-[0.22em] uppercase py-4.5 rounded-xl hover:bg-[#7a5c3e] transition-all duration-300 shadow-md hover:shadow-lg font-medium active:scale-[0.99]" style="padding-top:1.1rem; padding-bottom:1.1rem;">
        <span class="relative z-10">Checkout</span>
        <div class="absolute inset-0 h-full w-0 bg-white/20 transition-all duration-300 ease-out group-hover:w-full z-0"></div>
      </button>
      <button onclick="location.href='products.html'" class="w-full border-2 border-[#e8d8c8] text-[#9e7550] text-[12px] tracking-[0.22em] uppercase py-4 rounded-xl hover:bg-[#faf5ef] hover:border-[#c4a882] transition-colors font-medium">Continue Shopping</button>
    </div>
  </div>

  <div id="empty-cart" class="text-center py-16 hidden">
    <p class="text-brown-light text-lg mb-6" style="color:#b09882;">Your cart is beautiful, but empty.</p>
    <button onclick="location.href='products.html'" class="bg-[#9e7550] text-white text-[11px] tracking-[0.22em] uppercase px-8 py-3 rounded-full hover:bg-[#7a5c3e] transition shadow-sm">Shop Now</button>
  </div>
</main>

<script>
  // IndexedDB Helper
  const DB_NAME = 'HandyCraftDB';
  const STORE_NAME = 'cartImages';
  let db = null;

  async function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function getImagesFromIndexedDB(cartItemId) {
    if (!db) await initIndexedDB();
    return new Promise((resolve) => {
      try {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(cartItemId);
        request.onsuccess = () => resolve(request.result?.images || []);
        request.onerror = () => resolve([]);
      } catch (err) {
        resolve([]);
      }
    });
  }

  async function deleteImagesFromIndexedDB(cartItemId) {
    if (!db) await initIndexedDB();
    return new Promise((resolve) => {
      try {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(cartItemId);
        request.onsuccess = () => resolve();
        request.onerror = () => resolve();
      } catch (err) {
        resolve();
      }
    });
  }

  // Initialize IndexedDB
  initIndexedDB().catch(err => console.warn('IndexedDB not available:', err));

  let cart = JSON.parse(localStorage.getItem('hc_cart') || '[]');
  
  function calculateShipping(cartItems) {
    const hasFrames = cartItems.some(item => {
      const cat = (item.category || '').toLowerCase();
      const sub = (item.subcategory || '').toLowerCase();
      return cat.includes('frame') || sub.includes('frame');
    });
    return hasFrames ? 200 : 0;
  }

  async function renderCart() {
    const c = document.getElementById('cart-items');
    const s = document.getElementById('cart-summary');
    const e = document.getElementById('empty-cart');
    c.innerHTML = '';
    
    if(!cart.length) { s.classList.add('hidden'); e.classList.remove('hidden'); return; }
    e.classList.add('hidden'); s.classList.remove('hidden');
    
    let itemsTotal = 0;
    for (let i = 0; i < cart.length; i++) {
      const it = cart[i];
      const qty = it.qty || 1;
      itemsTotal += it.price * qty;

      // Load images from IndexedDB if available
      let customImages = it.customization?.images || [];
      if (it.hasImages) {
        const idbImages = await getImagesFromIndexedDB(it.id);
        if (idbImages.length > 0) {
          customImages = idbImages;
        }
      }

      c.insertAdjacentHTML('beforeend', `
      <div class="cart-item-anim flex gap-4 p-4 rounded-2xl bg-white shadow-sm hover:shadow-[0_8px_30px_rgba(158,117,80,0.08)] border border-[#e8d8c8]/60 transition-all duration-300 transform" style="animation-delay: ${i * 0.1}s;">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-[#faf5ef] shrink-0 border border-[#e8d8c8]/40">
          <img src="${it.img || it.image || 'images/placeholder.png'}" class="w-full h-full object-cover transition-transform duration-700 hover:scale-110" onerror="this.src='images/placeholder.png'">
        </div>
        <div class="flex flex-col grow justify-between py-0.5">
          <div class="flex justify-between items-start">
            <h3 class="font-medium text-[#4a3728] text-sm leading-tight max-w-[80%]">${it.name}</h3>
            <button onclick="removeFromCart('${it.id}')" class="text-[#c4a882] hover:text-red-500 transition-colors p-1" aria-label="Remove item">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-width="1.5"/></svg>
            </button>
          </div>
          ${it.messages ? `
          <div class="text-[10px] text-[#9e7550] mt-1.5 space-y-0.5 line-clamp-2">
            <span class="font-medium">Love:</span> ${it.messages.love} | 
            <span class="font-medium">Story:</span> ${it.messages.story} | 
            <span class="font-medium">Proud:</span> ${it.messages.proud} | 
            <span class="font-medium">Song:</span> ${it.messages.song}
          </div>
          ` : ''}
          ${customImages && customImages.length ? `
          <div class="flex gap-1 mt-1.5 overflow-x-auto pb-1">
            ${customImages.map(img => `<img src="${img}" class="w-8 h-8 object-cover rounded-md border border-[#e8d8c8]" onerror="this.src='images/placeholder.png'" />`).join('')}
          </div>
          ` : ''}
          <div class="flex justify-between items-center mt-2">
            <div class="flex items-center bg-[#faf5ef] rounded-[10px] px-1 py-1 border border-[#e8d8c8]">
              <button onclick="updateQty('${it.id}', -1)" class="w-7 h-7 text-[#9e7550] hover:bg-white rounded-md transition-colors font-medium">-</button>
              <span class="text-[13px] w-6 text-center text-[#4a3728] font-medium pointer-events-none">${qty}</span>
              <button onclick="updateQty('${it.id}', 1)" class="w-7 h-7 text-[#9e7550] hover:bg-white rounded-md transition-colors font-medium">+</button>
            </div>
            <span class="font-medium text-[#9e7550] text-[15px]">EGP ${it.price}</span>
          </div>
        </div>
      </div>`);
    }

    const shipping = calculateShipping(cart);
    const total = itemsTotal + shipping;
    
    let totalHtml = `EGP ${total.toFixed(2)}`;
    if (shipping > 0) {
      totalHtml = `<div class="text-right"><div class="text-[12px] text-brown-mid mb-1">Items: EGP ${itemsTotal.toFixed(2)}</div><div class="text-[12px] text-brown-mid mb-1">Shipping: EGP ${shipping.toFixed(2)}</div><div class="text-lg">Total: EGP ${total.toFixed(2)}</div></div>`;
    }
    
    document.getElementById('cart-total').innerHTML = totalHtml;
    localStorage.setItem('hc_cart', JSON.stringify(cart));
    
    // Update badge
    updateCartBadge();
  }
  
  function updateQty(targetId, d) { 
    const item = cart.find(it => (it.cartId || it.id) === targetId);
    if(item) {
      const newQty = (item.qty || 1) + d;
      if(newQty > 0) {
        item.qty = newQty;
      } else {
        deleteImagesFromIndexedDB(item.cartId || item.id);
        cart = cart.filter(it => (it.cartId || it.id) !== targetId);
      }
      localStorage.setItem('hc_cart', JSON.stringify(cart));
      renderCart();
    }
  }
  
  function removeFromCart(targetId) {
    const item = cart.find(it => (it.cartId || it.id) === targetId);
    if(item) {
      deleteImagesFromIndexedDB(item.cartId || item.id);
      cart = cart.filter(it => (it.cartId || it.id) !== targetId);
      localStorage.setItem('hc_cart', JSON.stringify(cart));
      renderCart();
    }
  }
  
  function updateCartBadge() {
    try {
      const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
      const badges = document.querySelectorAll("#cart-badge-nav");
      badges.forEach(b => {
        if (count > 0) { b.textContent = count; b.classList.remove('hidden'); }
        else b.classList.add('hidden');
      });
    } catch(e) {}
  }
  
  renderCart();
</script>
</body>
</html>
