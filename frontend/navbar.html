<script>
  window.openDrawer = function () {
    document.getElementById('mobile-drawer-wrapper').classList.remove('pointer-events-none');
    document.getElementById('drawer-backdrop').classList.remove('opacity-0');
    document.getElementById('drawer-panel').classList.remove('-translate-x-full');
  };
  window.closeDrawer = function () {
    document.getElementById('drawer-backdrop').classList.add('opacity-0');
    document.getElementById('drawer-panel').classList.add('-translate-x-full');
    setTimeout(() => document.getElementById('mobile-drawer-wrapper').classList.add('pointer-events-none'), 300);
  };

  document.getElementById('menu-open-btn')?.addEventListener('click', openDrawer);

  window.toggleSubmenu = function (btn) {
    btn.nextElementSibling.classList.toggle('hidden');
    const arrow = btn.querySelector('.arrow');
    if (arrow) arrow.textContent = btn.nextElementSibling.classList.contains('hidden') ? '▼' : '▲';
  };

  async function loadDynamicMenu() {
    try {
      const API_BASE_URL = (window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api").replace(/\/$/, '');
      const [catRes, subRes] = await Promise.all([
        fetch(`${API_BASE_URL}/categories`),
        fetch(`${API_BASE_URL}/subcategories`)
      ]);
      const catData = await catRes.json();
      const subData = await subRes.json();

      const categories = (catData.data || []).filter(c => c.isActive).sort((a, b) => a.order - b.order);
      const subcategories = (subData.data || []).filter(s => s.isActive);

      const container = document.getElementById('dynamic-menu-root');
      if (!container) return;

      container.innerHTML = `
        <a href="products.html" class="block font-bold text-[#6b4f35] hover:text-[#9e7550]">Shop Products</a>
        ${categories.map(cat => {
        const subs = subcategories.filter(s => s.categoryId === cat._id);
        return `
                <div class="category-item">
                    <button onclick="toggleSubmenu(this)" class="text-[#c4a882] hover:text-[#9e7550] transition-colors text-[11px] font-bold uppercase tracking-wider flex justify-between w-full">
                        ${cat.name} <span class="arrow">▼</span>
                    </button>
                    <div class="hidden pl-4 mt-2 flex flex-col gap-1">
                        <a href="products.html?category=${cat.slug}" class="text-[#c4a882] hover:text-[#9e7550] transition-colors text-[10px] uppercase">All ${cat.name}</a>
                        ${subs.map(sub => `
                            <a href="products.html?category=${cat.slug}&subcategory=${sub.slug}" class="text-[#c4a882] hover:text-[#9e7550] transition-colors text-[10px] uppercase">
                                • ${sub.name}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
      }).join('')}
    `;
    } catch (error) {
      console.error('Error loading dynamic menu:', error);
    }
  }

  // Ensure menu loads when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadDynamicMenu);
  } else {
    loadDynamicMenu();
  }

  window.updateCartBadge = function () {
    try {
      const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
      const count = cart.reduce((sum, item) => sum + (item.qty || item.quantity || 1), 0);
      const badges = document.querySelectorAll("#cart-badge-nav");
      badges.forEach(b => {
        if (count > 0) { b.textContent = count; b.classList.remove('hidden'); }
        else b.classList.add('hidden');
      });
    } catch (e) { }
  };
  if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", window.updateCartBadge);
  } else {
    window.updateCartBadge();
  }
</script>
