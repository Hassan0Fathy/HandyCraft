  <!-- IndexedDB Helper -->
  <script>
    // IndexedDB for storing large image data
    const DB_NAME = 'HandyCraftDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'cartImages';
    
    let db = null;

    async function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    }

    async function saveImagesToIndexedDB(cartItemId, images) {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put({ id: cartItemId, images });
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve();
      });
    }

    async function getImagesFromIndexedDB(cartItemId) {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(cartItemId);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result?.images || []);
      });
    }

    async function deleteImagesFromIndexedDB(cartItemId) {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(cartItemId);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve();
      });
    }

    // Initialize on page load
    initIndexedDB().catch(err => console.warn('IndexedDB not available:', err));
  </script>

<main class="flex-grow max-w-[520px] mx-auto w-full px-6 py-8" id="product-container">
    <!-- Dynamic content -->

  
  <script>
    const productContainer = document.getElementById('product-container');
    const params = new URLSearchParams(window.location.search);
    const productId = (params.get('id') || '').trim();
    const API_BASE_URL = (window.RUNTIME_CONFIG?.API_BASE_URL || "http://localhost:5000/api").replace(/\/$/, '');

    function renderError(title, message) {
      productContainer.innerHTML = `
        <div class="text-center py-20 text-brown-light">
          <p class="font-cormorant text-3xl italic text-[#6b4f35] mb-3">${title}</p>
          <p class="text-sm text-[#9e7550] mb-6">${message}</p>
          <a href="products.html" class="inline-flex items-center justify-center bg-[#9e7550] text-white px-5 py-3 rounded-xl text-[12px] uppercase tracking-widest hover:bg-[#6b4f35] transition">Back to products</a>
        </div>
      `;
    }

    let selectedImages = [];

    window.handleProductImagePreview = function(event, index) {
        if (!selectedImages[index]) selectedImages[index] = [];
        const files = event.target.files;
        if (!files || files.length === 0) return;
        
        const input = event.target;
        const maxImages = parseInt(input.getAttribute("data-max-images")) || 100;
        
        Array.from(files).forEach(file => {
            if (selectedImages[index].length < maxImages) {
                selectedImages[index].push(file);
            }
        });
        
        renderProductPreviews(index);
        event.target.value = '';
    }

    window.renderProductPreviews = function(index) {
        const container = document.getElementById(`preview_${index}`);
        if (!container) return;
        container.innerHTML = '';
        selectedImages[index].forEach((file, fileIdx) => {
            const reader = new FileReader();
            reader.onload = e => {
                const wrapper = document.createElement('div');
                wrapper.className = 'w-16 h-16 rounded-xl overflow-hidden border border-[#e8d8c8]/80 relative group shadow-sm bg-white item-img-wrapper shrink-0';
                wrapper.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover item-uploaded-img">
                   <button type="button" class="absolute top-1 right-1 bg-black/60 hover:bg-black/80 text-white rounded-full w-4 h-4 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition z-10" onclick="removeProductImage(event, ${index}, ${fileIdx})">&times;</button>
                   <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition pointer-events-none"></div>`;
                container.appendChild(wrapper);
            };
            reader.readAsDataURL(file);
        });
    }

    window.removeProductImage = function(event, index, fileIdx) {
        event.preventDefault();
        selectedImages[index].splice(fileIdx, 1);
        window.renderProductPreviews(index);
    }

    let currentVariant = null;
    let activeProduct = null;

    function buildCustomFieldsHtml(fields) {
      if (!fields || !fields.length) return `<p class="text-sm text-[#9e7550] italic">No customization required for this design.</p>`;
      
      return fields.map((f, idx) => {
        const safeLabel = String(f.label || f.name || '').trim();
        const safeType = String(f.type || '').trim();
        if (!safeLabel || (safeType !== 'text' && safeType !== 'image')) return '';

        const requiredMarker = f.required ? '<span class="text-red-500 ml-1">*</span>' : '';
        const minImages = f.minImages || 1;
        const maxImages = f.maxImages || 100;

        if (safeType === 'image') {
          return `
            <div class="mb-4">
              <label class="block text-[11px] uppercase tracking-widest text-[#9e7550] mb-2 font-medium">
                ${safeLabel}${requiredMarker}
              </label>
              <input type="file" accept="image/*" multiple data-field-type="image" data-field-name="${encodeURIComponent(safeLabel)}" 
                data-required="${f.required}" data-min-images="${minImages}" data-max-images="${maxImages}" onchange="handleProductImagePreview(event, ${idx})"
                class="w-full bg-[#fffdf9] rounded-xl px-4 py-3 text-sm text-[#6b4f35] border-2 border-[#e8d8c8] outline-none focus:border-[#9e7550] transition" />
              <p class="text-[11px] text-[#c4a882] mt-1">Upload ${minImages} to ${maxImages} photos</p>
              <div id="preview_${idx}" class="flex flex-wrap gap-3 mt-3 empty:hidden"></div>
              <p class="text-[10px] text-red-500 hidden error-msg-${idx}"></p>
            </div>
          `;
        }

        return `
          <div class="mb-4">
            <label class="block text-[11px] uppercase tracking-widest text-[#9e7550] mb-2 font-medium">
              ${safeLabel}${requiredMarker}
            </label>
            <input type="text" data-field-type="text" data-field-name="${encodeURIComponent(safeLabel)}" 
              data-required="${f.required === true ? 'true' : 'false'}"
              class="w-full bg-[#fffdf9] rounded-xl px-4 py-3 text-sm text-[#6b4f35] border-2 border-[#e8d8c8] outline-none focus:border-[#9e7550] transition" 
              placeholder="Enter ${safeLabel}" />
            <p class="text-[10px] text-red-500 hidden error-msg-${idx}"></p>
          </div>
        `;
      }).join('');
    }

    window.selectVariant = function(idx) {
      if (!activeProduct || !activeProduct.variants || !activeProduct.variants[idx]) return;
      currentVariant = activeProduct.variants[idx];
      
      // Highlight circular thumbnails
      document.querySelectorAll('.variant-thumb').forEach((thumb, i) => {
        if (i === idx) {
          thumb.classList.add('variant-active');
        } else {
          thumb.classList.remove('variant-active');
        }
      });

      const priceEl = document.getElementById('product-price');
      if (priceEl) {
        priceEl.textContent = (currentVariant.price !== undefined && currentVariant.price !== null ? currentVariant.price : activeProduct.price) + ' EGP';
      }

      const customFieldsForm = document.getElementById('custom-fields-form');
      if (customFieldsForm) {
        const fields = currentVariant.customFields && currentVariant.customFields.length > 0 ? currentVariant.customFields : (activeProduct.customFields || []);
        customFieldsForm.innerHTML = buildCustomFieldsHtml(fields);
        selectedImages = []; // reset images when switching variants
      }
    };

      currentVariant = null;

      let images = [];

        images = product.images.filter(img => typeof img === 'string' && img.trim());
      } else if (product.image && typeof product.image === 'string') {
        images = [product.image];
      }
      
      if (images.length === 0) {
        images = ['images/placeholder.png'];
      }

      let mainImage = images[0];
      let fieldsHtml = buildCustomFieldsHtml(product.customFields || []);
      let priceDisplay = product.price || 0;

            <div id="variant-thumbnails" class="flex gap-4 overflow-x-auto pb-2">
              ${product.variants.map((v, i) => {

                    </div>
                    <span class="text-[9px] uppercase tracking-tight text-brown-mid text-center max-w-[65px] truncate leading-tight">${v.name}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

        variantsHtml = `
          <div class="bg-white rounded-2xl p-5 border border-[#ecdccc]/50 mb-6">
            <h3 class="text-[10px] uppercase tracking-widest text-[#9e7550] mb-4">Choose Design</h3>
            <div class="flex flex-wrap gap-2">
              ${product.variants.map((v, i) => `

      const thumbnailsHtml = images.length > 1 ? images.map((img, idx) => `

            ${isOutOfStock ? `

          </div>

            </div>
            <span id="product-price" class="text-lg font-medium text-[#9e7550]">${priceDisplay} EGP</span>
          </div>
          <p class="text-[10px] tracking-[0.2em] text-[#c4a882] mb-6">${product.category || 'Handmade Gift'}</p>

          ${(product.category || '').toLowerCase() === 'graduation' && (product.subcategory || '').toLowerCase() === 'frames' ? `

            <p class="text-[11px] text-[#9e7550] leading-relaxed flex items-start gap-2">

              <span>Quantity applies to the same design only. If you need multiple different designs, add this design to cart first, then create another one.</span>

              ${isOutOfStock ? 'Out of Stock' : 'Buy Now'}

            <a href="products.html" class="w-full bg-[#f5ede3] text-[#9e7550] py-3 rounded-xl text-[12px] uppercase tracking-widest hover:bg-[#ebdccc] transition text-center border border-[#ecdccc]">
              Back

      // Append Success Modal HTML

      const modalHtml = `

          <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeSuccessModal()"></div>

                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>

                <p class="text-[12px] opacity-80">Click 'Create Another Design' to add a completely different customization with different photos, text, or notes.</p>

      updateDesignCounter(); // Initial count

    async function fileToBase64(file) {
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Failed to read image"));
        reader.readAsDataURL(file);
      });
    }

    async function validateAndBuildCustomization() {
      const container = document.getElementById("custom-fields-form");
      const inputs = container ? Array.from(container.querySelectorAll("[data-field-type]")) : [];
      const customization = { images: [] };
      let hasError = false;

      // Clear previous errors
      document.querySelectorAll('[class*="error-msg-"]').forEach(el => {
        el.classList.add('hidden');
        el.textContent = '';
      });

      for (let fieldIdx = 0; fieldIdx < inputs.length; fieldIdx++) {
        const el = inputs[fieldIdx];
        const type = el.getAttribute("data-field-type");
        const name = decodeURIComponent(el.getAttribute("data-field-name") || "");
        const required = el.getAttribute("data-required") === "true" || el.getAttribute("data-required") === true;
        const minImages = parseInt(el.getAttribute("data-min-images")) || 1;
        const maxImages = parseInt(el.getAttribute("data-max-images")) || 100;
        const errorMsg = document.querySelector(`.error-msg-${fieldIdx}`);
        
        if (!name) continue;

        if (type === "text") {
          const value = String(el.value || "").trim();
          if (required && !value) {
            if (errorMsg) {
              errorMsg.textContent = `${name} is required`;
              errorMsg.classList.remove('hidden');
            }
            hasError = true;
          } else if (value) {
            customization[name] = value;
          }
        } else if (type === "image") {
          const files = selectedImages[fieldIdx] || [];
          const fileCount = files.length;

          if (required && fileCount === 0) {
            if (errorMsg) {
              errorMsg.textContent = `Please upload at least ${minImages} photo(s)`;
              errorMsg.classList.remove('hidden');
            }
            hasError = true;
          } else if (fileCount > 0) {
            if (fileCount < minImages || fileCount > maxImages) {
              if (errorMsg) {
                errorMsg.textContent = `Please upload between ${minImages} and ${maxImages} photos (${fileCount} selected)`;
                errorMsg.classList.remove('hidden');
              }
              hasError = true;
            } else {
              for (const file of files) {
                try {
                  const base64 = await fileToBase64(file);
                  customization.images.push({ file: base64, field: name });
                } catch (err) {
                  throw new Error(`Failed to read ${file.name}: ${err.message}`);
                }
              }
            }
          }
        }
      }

      if (hasError) throw new Error('Please fix the errors above');
      return customization;
    }

    async function persistItemToCart(product, customization, qty) {
      const cart = JSON.parse(localStorage.getItem("hc_cart") || "[]");
      
      let finalPrice = Number(product.price) || 0;
      let finalName = product.name;
      let finalImg = product.images?.[0] || product.image || '';
      let variantName = null;

      if (currentVariant) {
        finalName = `${product.name} - ${currentVariant.name}`;
        variantName = currentVariant.name;
        finalImg = currentVariant.images?.[0] || finalImg;
        if (currentVariant.price !== undefined && currentVariant.price !== null) {
          finalPrice = Number(currentVariant.price);
        }
      }

      const isProductCustomizable = (document.getElementById("custom-fields-form")?.querySelectorAll("[data-field-type]").length > 0);
      const params = new URLSearchParams(window.location.search);
      const forceNewDesign = params.get('newDesign') === 'true';

      let existingItem = null;
      if (!isProductCustomizable && !forceNewDesign) {
          existingItem = cart.find(item => item.baseId === (product._id || product.id) && item.variantName === variantName);
      }
      
      if (existingItem) {
        existingItem.qty = (existingItem.qty || 1) + qty;
      } else {
        const cartItemId = (typeof crypto !== 'undefined' && crypto.randomUUID) 
          ? crypto.randomUUID() 
          : Date.now().toString(36) + Math.random().toString(36).substr(2);
        
        const customizationForStorage = { ...customization, images: [] };
        
        const cartItem = {
          id: cartItemId,
          cartId: cartItemId,
          baseId: product._id || product.id,
          category: String(product.category || '').trim(),
          subcategory: String(product.subcategory || '').trim(),
          variantId: currentVariant?._id || currentVariant?.id || null,
          variantName: variantName,
          name: finalName,
          price: finalPrice,
          qty: Math.max(1, qty),
          img: finalImg,
          customization: customizationForStorage,
          hasImages: customization.images.length > 0
        };
        
        if (customization.images.length > 0) {
          await saveImagesToIndexedDB(cartItemId, customization.images);
        }
        cart.push(cartItem);
      }
      
      localStorage.setItem("hc_cart", JSON.stringify(cart));
      
      if (forceNewDesign) {
          params.delete('newDesign');
          const newQuery = params.toString() ? '?' + params.toString() : '';
          window.history.replaceState({}, '', window.location.pathname + newQuery);
      }
      
      window.updateCartBadge && window.updateCartBadge();
      updateDesignCounter();
    }

    async function processPurchase(product, isBuyNow = false) {
      const btnId = isBuyNow ? 'buy-now-btn' : 'add-to-cart-btn';
      const btn = document.getElementById(btnId);
      const originalText = btn.textContent;

      btn.disabled = true;
      btn.textContent = isBuyNow ? 'Processing...' : 'Adding...';

      try {
        const customization = await validateAndBuildCustomization();
        const qty = parseInt(document.getElementById("qty-input")?.value) || 1;

        await persistItemToCart(product, customization, qty);

        if (isBuyNow) {
          window.location.href = 'payment.html';
        } else {
          openSuccessModal();
          btn.textContent = '✓ Added to cart!';
          btn.style.backgroundColor = '#2e8b57';
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '';
            btn.disabled = false;
          }, 2000);
        }
      } catch (error) {
        if (error.message === 'Please fix the errors above') {
          btn.textContent = originalText;
          btn.disabled = false;
        } else {
          btn.textContent = 'Error - try again';
          console.error('Purchase error:', error);
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '';
            btn.disabled = false;
          }, 2000);
        }
      }
    }

    function setMainImage(src, el) {

      document.querySelectorAll('.thumbnail').forEach((thumb) => {
        thumb.classList.remove('border-[#9e7550]', 'opacity-100');
        thumb.classList.add('border-transparent', 'opacity-70');
      });
      el.classList.remove('border-transparent', 'opacity-70');
      el.classList.add('border-[#9e7550]', 'opacity-100');
      const mainImg = document.getElementById('main-image');
      mainImg.style.opacity = 0;
      setTimeout(() => {
        mainImg.src = src;
        mainImg.style.opacity = 1;
      }, 120);
    }

    function decreaseQty() {
      const input = document.getElementById('qty-input');
      const val = parseInt(input.value) || 1;
      input.value = Math.max(1, val - 1);
    }

    function increaseQty() {
      const input = document.getElementById('qty-input');
      const val = parseInt(input.value) || 1;
      input.value = val + 1;
    }

    // --- NEW WORKFLOW FUNCTIONS ---

    function openSuccessModal() {
      const modal = document.getElementById('success-modal');
      if (modal) {
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeSuccessModal() {
      const modal = document.getElementById('success-modal');
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function resetCustomizationForm() {
      const container = document.getElementById('custom-fields-form');
      if (container) {
        // Clear all inputs (text, file, etc)
        const inputs = container.querySelectorAll('input');
        inputs.forEach(input => {
          if (input.type === 'file') input.value = '';
          else if (input.type === 'radio' || input.type === 'checkbox') input.checked = false;
          else input.value = '';
        });
        
        // Clear all textareas
        const textareas = container.querySelectorAll('textarea');
        textareas.forEach(ta => ta.value = '');
        
        // Clear all selects
        const selects = container.querySelectorAll('select');
        selects.forEach(s => s.selectedIndex = 0);
      }
      
      // Reset internal image state
      selectedImages = [];
      
      // Clear all UI previews
      const previews = document.querySelectorAll('[id^="preview_"]');
      previews.forEach(p => p.innerHTML = '');
      
      // Reset quantity to 1
      const qtyInput = document.getElementById('qty-input');
      if (qtyInput) qtyInput.value = '1';
    }

    function updateDesignCounter() {
      const cart = JSON.parse(localStorage.getItem('hc_cart') || '[]');
      const currentPid = activeProduct ? (activeProduct._id || activeProduct.id) : productId;
      
      // Count unique designs (different cart items) for this base product
      const designCount = cart.filter(item => item.baseId === currentPid).length;
      
      const counterEl = document.getElementById('design-counter');
      if (counterEl) {
        if (designCount > 0) {
          counterEl.innerHTML = `
            <div class="flex items-center gap-2 text-[11px] font-medium text-green-600 bg-green-50 px-3 py-1.5 rounded-full border border-green-100 mb-4 animate-fade-in shrink-0 w-fit">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              ${designCount} ${designCount === 1 ? 'Design' : 'Designs'} Added
            </div>
          `;
        } else {
          counterEl.innerHTML = '';
        }
      }
    }

    function handleCreateAnother() {
      closeSuccessModal();
      resetCustomizationForm();
    }

    window.openSuccessModal = openSuccessModal;
    window.closeSuccessModal = closeSuccessModal;
    window.handleCreateAnother = handleCreateAnother;
    window.updateDesignCounter = updateDesignCounter;
    window.resetCustomizationForm = resetCustomizationForm;

    window.setMainImage = setMainImage;
    window.decreaseQty = decreaseQty;
    window.increaseQty = increaseQty;

    async function loadProduct() {
      if (!productId) {
        renderError('Missing product ID.', "Please open this page using a valid product link like product-details.html?id=<productId>.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/products/${encodeURIComponent(productId)}`);
        const result = await response.json();

        if (response.status === 404) {
          renderError('Product not found.', `We could not find a product matching id "${productId}".`);
          return;
        }

        if (!response.ok) {
          throw new Error(result?.message || result?.error || 'Failed to load product');
        }

        const product = result?.data || result;
        console.log('Product Loaded:', product);
        renderProduct(product);
      } catch (error) {
        renderError('Unable to load product.', error.message);
      }
    }
  

    loadProduct();
  </script>
